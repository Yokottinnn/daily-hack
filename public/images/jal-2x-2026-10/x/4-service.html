<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
  :root{--pink-600:#D63E76;--pink-700:#A82959;--cream-50:#FFFBEE;--cream-100:#FFF1C8;--yellow-500:#F5C518;--ink:#2A1923;--ink-2:#5A4651;--line:#F1DCE5}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1080px;overflow:hidden}
  body{font-family:"Noto Sans JP",sans-serif;background:var(--cream-50);color:var(--ink)}
  header{height:250px;background:linear-gradient(135deg,#2A1923,#46293A);display:flex;align-items:center;gap:34px;padding:0 64px}
  header img{width:150px;height:150px;border-radius:34px;background:#fff;box-shadow:0 10px 26px -10px rgba(0,0,0,.5)}
  header .t{color:#fff}
  header .k{font-size:30px;font-weight:700;color:var(--yellow-500);letter-spacing:.04em}
  header h1{font-size:62px;font-weight:900;line-height:1.15;margin-top:6px;white-space:nowrap}
  main{display:flex;gap:44px;padding:52px 64px 0}
  .phone{flex:0 0 400px;height:712px;border-radius:44px;overflow:hidden;background:#fff;
         box-shadow:0 22px 44px -18px rgba(214,62,118,.38);border:10px solid #fff}
  .phone img{width:100%;height:100%;object-fit:cover;display:block;border-radius:34px}
  ul{list-style:none;display:flex;flex-direction:column;justify-content:space-between;height:712px;flex:1}
  li{background:#fff;border:2px solid var(--line);border-radius:24px;padding:30px 28px;box-shadow:0 8px 24px -14px rgba(214,62,118,.28)}
  li .h{font-size:24px;font-weight:700;color:var(--pink-600)}
  li .b{font-size:31px;font-weight:900;line-height:1.35;margin-top:6px}
  li .s{font-size:22px;font-weight:500;color:var(--ink-2);margin-top:6px;line-height:1.45}
</style></head>
<body>
<header>
  <img src="../../walk-poikatsu-2026/logos/jalwellness.png" alt="">
  <div class="t">
    <div class="k">歩いてJALマイルが貯まるアプリ</div>
    <h1>JAL Wellness &amp; Travel</h1>
  </div>
</header>
<main>
  <div class="phone"><img src="../../walk-poikatsu-2026/apps/jal-shot.jpg" alt=""></div>
  <ul>
    <li><div class="h">歩く</div><div class="b">1日6,000／8,000／<br>10,000歩の3段階</div><div class="s">達成するとマイルと抽選券</div></li>
    <li><div class="h">料金</div><div class="b">月550円</div><div class="s">初回は入会日から翌月末まで無料</div></li>
    <li><div class="h">歩数のほかにも</div><div class="b">空港チェックインでもマイル</div><div class="s">月20万歩で毎月500名に500マイルの抽選</div></li>
  </ul>
</main>
</body></html>
