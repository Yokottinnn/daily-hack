name: weekly-pv-report

# 週次で Cloudflare Zone Analytics から PV 上位 25 ページを取得し
# Actions の Step Summary（タブ「Summary」）に整形して掲載する。
# 月曜 朝7時 JST に自動実行 + 任意で workflow_dispatch から手動起動可能。

on:
  schedule:
    - cron: '0 22 * * 0'   # 毎週日曜 22:00 UTC = 月曜 07:00 JST
  workflow_dispatch:
    inputs:
      days:
        description: '集計対象日数（デフォ7）'
        required: false
        default: '7'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: daily-hack.fieldbeside.com
      DOMAIN: fieldbeside.com
      DAYS: ${{ github.event.inputs.days || '7' }}
    steps:
      - name: Resolve Cloudflare zone id
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=${DOMAIN}" \
            -H "Authorization: Bearer ${CF_TOKEN}" | jq -r '.result[0].id')
          echo "zone_id=${ZONE_ID}" >> "$GITHUB_ENV"
          echo "Resolved zone_id=${ZONE_ID}"

      - name: Query Zone Analytics (GraphQL, 1日ループ集計)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # httpRequestsAdaptiveGroups は zone あたり 1d 制限なので日次ループ
          END_EPOCH=$(date -u +%s)
          read -r -d '' QUERY <<'GQL' || true
          query($zoneTag: String!, $start: Time!, $end: Time!, $host: String!) {
            viewer {
              zones(filter: { zoneTag: $zoneTag }) {
                httpRequestsAdaptiveGroups(
                  limit: 200,
                  filter: {
                    datetime_geq: $start,
                    datetime_leq: $end,
                    clientRequestHTTPHost: $host,
                    edgeResponseStatus: 200,
                    requestSource: "eyeball"
                  },
                  orderBy: [sum_visits_DESC]
                ) {
                  sum { visits }
                  count
                  dimensions { clientRequestPath }
                }
              }
            }
          }
          GQL
          echo "[]" > /tmp/all.json  # 累積バッファ
          ALL_VISITS=0; ALL_REQ=0
          for d in $(seq "${DAYS}" -1 1); do
            END_T=$(date -u -d "-$((d-1)) days" +%FT00:00:00Z)
            START_T=$(date -u -d "-${d} days" +%FT00:00:00Z)
            jq -n --arg q "$QUERY" --arg zone "$zone_id" --arg start "$START_T" --arg end "$END_T" --arg host "$HOST" \
              '{query:$q, variables:{zoneTag:$zone, start:$start, end:$end, host:$host}}' > /tmp/q.json
            curl -s https://api.cloudflare.com/client/v4/graphql \
              -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
              --data-binary @/tmp/q.json > /tmp/day.json
            echo "── ${START_T} → ${END_T} ──"
            jq '.errors // empty' /tmp/day.json
            DAY_ROWS=$(jq '.data.viewer.zones[0].httpRequestsAdaptiveGroups // []' /tmp/day.json)
            jq -n --argjson a "$(cat /tmp/all.json)" --argjson b "$DAY_ROWS" '$a + $b' > /tmp/all.json
            v=$(echo "$DAY_ROWS" | jq '[.[].sum.visits] | add // 0')
            r=$(echo "$DAY_ROWS" | jq '[.[].count] | add // 0')
            ALL_VISITS=$((ALL_VISITS + v))
            ALL_REQ=$((ALL_REQ + r))
          done
          START="$(date -u -d "-${DAYS} days" +%FT00:00:00Z)"
          END="$(date -u +%FT%TZ)"
          # 同一パスを合算（複数日にわたるため）
          jq '
            [ group_by(.dimensions.clientRequestPath)[]
              | { dimensions: { clientRequestPath: .[0].dimensions.clientRequestPath },
                  sum: { visits: ([.[].sum.visits] | add) },
                  count: ([.[].count] | add) }
            ]
            | map(select(.dimensions.clientRequestPath | startswith("/posts/")))
            | sort_by(.sum.visits) | reverse | .[:25]
            | .[] | "\(.sum.visits)\t\(.count)\t\(.dimensions.clientRequestPath)"
          ' -r /tmp/all.json > /tmp/top.tsv || echo "(集計失敗)"
          ALL_PATHS=$(jq 'length' /tmp/all.json)
          # --- stdout echo (log-readable, API can't fetch step summary) ---
          echo "STDOUT_TOTALS visits=${ALL_VISITS} requests=${ALL_REQ} paths=${ALL_PATHS}"
          echo "STDOUT_TOP_START"
          cat /tmp/top.tsv || true
          echo "STDOUT_TOP_END"
          {
            echo "# Weekly PV Report — ${HOST}"
            echo
            echo "**Window**: ${START} → ${END} (${DAYS}日)"
            echo
            echo "- 全パス数: ${ALL_PATHS}"
            echo "- 総 visits: ${ALL_VISITS}"
            echo "- 総 requests: ${ALL_REQ}"
            echo
            echo "## Top 25 posts by visits"
            echo
            echo "| 順 | visits | requests | path |"
            echo "|---|---|---|---|"
            i=0
            while IFS=$'\t' read -r v c p; do
              i=$((i+1))
              echo "| ${i} | ${v} | ${c} | \`${p}\` |"
            done < /tmp/top.tsv
            echo
            echo "---"
            echo "RAW GraphQL response (deburrable):"
            echo '```json'
            ( jq '.' /tmp/all.json 2>/dev/null | head -200 ) || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Optional Slack post (if SLACK_WEBHOOK_URL set)
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          {
            echo "*Weekly PV Report — ${HOST} (${DAYS}日)*"
            echo '```'
            echo "rank visits  path"
            i=0
            while IFS=$'\t' read -r v r p; do
              i=$((i+1)); printf "%-4d %-7s %s\n" "$i" "$v" "$p"
            done < /tmp/top.tsv
            echo '```'
          } > /tmp/msg
          jq -Rs --arg c "$(cat /tmp/msg)" '{text:$c}' < /dev/null > /tmp/payload.json
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H "Content-Type: application/json" --data @/tmp/payload.json
