name: weekly-pv-report

# 週次で Cloudflare Zone Analytics から PV 上位 25 ページを取得し
# Actions の Step Summary（タブ「Summary」）に整形して掲載する。
# 月曜 朝7時 JST に自動実行 + 任意で workflow_dispatch から手動起動可能。

on:
  schedule:
    - cron: '0 22 * * 0'   # 毎週日曜 22:00 UTC = 月曜 07:00 JST
  workflow_dispatch:
    inputs:
      days:
        description: '集計対象日数（デフォ7）'
        required: false
        default: '7'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: daily-hack.fieldbeside.com
      DOMAIN: fieldbeside.com
      DAYS: ${{ github.event.inputs.days || '7' }}
      GQL_LIMIT: '5000'   # GraphQL の limit と同じ値。飽和の判定に使う
    steps:
      - name: Resolve Cloudflare zone id
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=${DOMAIN}" \
            -H "Authorization: Bearer ${CF_TOKEN}" | jq -r '.result[0].id')
          echo "zone_id=${ZONE_ID}" >> "$GITHUB_ENV"
          echo "Resolved zone_id=${ZONE_ID}"

      - name: Query Zone Analytics (GraphQL, 1日ループ集計)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # httpRequestsAdaptiveGroups は zone あたり 1d 制限なので日次ループ
          # **limit は 200 では足りない。** 1 日の実パス数が 200 を超えるため、
          # `orderBy: sum_visits_DESC` の下位（visits=1 の裾）が毎日 切り捨てられ、
          # **総 visits が下限値になっていた**（2026-09-27 に発覚。26 日で 198.6 行/日＝ほぼ上限）。
          # 飽和しているかは下の ROWS= の行で毎日 見える。上限に張り付いたら limit を上げる。
          END_EPOCH=$(date -u +%s)
          read -r -d '' QUERY <<'GQL' || true
          query($zoneTag: String!, $start: Time!, $end: Time!, $host: String!) {
            viewer {
              zones(filter: { zoneTag: $zoneTag }) {
                httpRequestsAdaptiveGroups(
                  limit: 5000,
                  filter: {
                    datetime_geq: $start,
                    datetime_leq: $end,
                    clientRequestHTTPHost: $host,
                    edgeResponseStatus: 200,
                    requestSource: "eyeball"
                  },
                  orderBy: [sum_visits_DESC]
                ) {
                  sum { visits }
                  count
                  dimensions { clientRequestPath }
                }
              }
            }
          }
          GQL
          echo "[]" > /tmp/all.json  # 累積バッファ
          echo "[]" > /tmp/all-clientCountryName.json
          echo "[]" > /tmp/all-userAgentBrowser.json
          # 次元だけ差し替えるテンプレート。**ネストした heredoc は YAML を壊す**ので printf。
          printf '%s\n' \
            'query($zoneTag: String!, $start: Time!, $end: Time!, $host: String!) {' \
            '  viewer { zones(filter: { zoneTag: $zoneTag }) {' \
            '    httpRequestsAdaptiveGroups(' \
            '      limit: 200, orderBy: [sum_visits_DESC],' \
            '      filter: { datetime_geq: $start, datetime_leq: $end,' \
            '                clientRequestHTTPHost: $host, edgeResponseStatus: 200,' \
            '                requestSource: "eyeball" }' \
            '    ) { sum { visits } count dimensions { DIMENSION } }' \
            '  } }' \
            '}' > /tmp/tmpl.graphql
          ALL_VISITS=0; ALL_REQ=0
          for d in $(seq "${DAYS}" -1 1); do
            END_T=$(date -u -d "-$((d-1)) days" +%FT00:00:00Z)
            START_T=$(date -u -d "-${d} days" +%FT00:00:00Z)
            jq -n --arg q "$QUERY" --arg zone "$zone_id" --arg start "$START_T" --arg end "$END_T" --arg host "$HOST" \
              '{query:$q, variables:{zoneTag:$zone, start:$start, end:$end, host:$host}}' > /tmp/q.json
            curl -s https://api.cloudflare.com/client/v4/graphql \
              -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
              --data-binary @/tmp/q.json > /tmp/day.json
            echo "── ${START_T} → ${END_T} ──"
            jq '.errors // empty' /tmp/day.json
            # **累積 JSON を jq の引数に渡さない。**
            # `--argjson a "$(cat /tmp/all.json)"` だと日数が増えるほど argv が伸び、
            # **`jq: Argument list too long` で落ちる**（2026-09-27 に原因を特定）。
            # 9/14・9/21 の定時も同じ理由で失敗していて、**PV が 2 週間 以上 出ていなかった。**
            # ファイル経由なら argv に載らないので、日数をいくつにしても落ちない。
            jq '.data.viewer.zones[0].httpRequestsAdaptiveGroups // []' /tmp/day.json > /tmp/day-rows.json
            jq -s 'add' /tmp/all.json /tmp/day-rows.json > /tmp/all.next.json
            mv /tmp/all.next.json /tmp/all.json
            v=$(jq '[.[].sum.visits] | add // 0' /tmp/day-rows.json)
            r=$(jq '[.[].count] | add // 0' /tmp/day-rows.json)
            rows=$(jq 'length' /tmp/day-rows.json)
            echo "ROWS=${rows} visits=${v} requests=${r}"
            # **「visits」は読者数ではない。** 2026-09-27 に実測したところ、
            # 1 日 319 visits のうち **日本は 11 / 実ブラウザは 14** で、
            # 残りはボットとクローラだった（FR 191・Unknown 249・BingBot 37）。
            # **総数だけ報告すると、ボットの数を読者数として渡すことになる。**
            # だから国とブラウザの内訳も毎日 引いて、人間ぶんを別に出す。
            for extra in clientCountryName userAgentBrowser; do
              sed "s/DIMENSION/${extra}/" /tmp/tmpl.graphql > /tmp/qx.graphql
              jq -n --rawfile q /tmp/qx.graphql --arg zone "$zone_id" --arg start "$START_T" \
                --arg end "$END_T" --arg host "$HOST" \
                '{query:$q, variables:{zoneTag:$zone, start:$start, end:$end, host:$host}}' > /tmp/qx.json
              curl -s https://api.cloudflare.com/client/v4/graphql \
                -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
                --data-binary @/tmp/qx.json > /tmp/rx.json
              jq '.data.viewer.zones[0].httpRequestsAdaptiveGroups // []' /tmp/rx.json > /tmp/rx-rows.json
              jq -s 'add' "/tmp/all-${extra}.json" /tmp/rx-rows.json > /tmp/nx.json
              mv /tmp/nx.json "/tmp/all-${extra}.json"
            done
            if [ "$rows" -ge "$GQL_LIMIT" ]; then
              echo "::warning::${START_T} の行数が上限 ${GQL_LIMIT} に達した。**総 visits は下限値。** limit を上げること"
            fi
            ALL_VISITS=$((ALL_VISITS + v))
            ALL_REQ=$((ALL_REQ + r))
          done
          START="$(date -u -d "-${DAYS} days" +%FT00:00:00Z)"
          END="$(date -u +%FT%TZ)"
          # 同一パスを合算（複数日にわたるため）
          jq '
            [ group_by(.dimensions.clientRequestPath)[]
              | { dimensions: { clientRequestPath: .[0].dimensions.clientRequestPath },
                  sum: { visits: ([.[].sum.visits] | add) },
                  count: ([.[].count] | add) }
            ]
            | map(select(.dimensions.clientRequestPath | startswith("/posts/")))
            | sort_by(.sum.visits) | reverse | .[:25]
            | .[] | "\(.sum.visits)\t\(.count)\t\(.dimensions.clientRequestPath)"
          ' -r /tmp/all.json > /tmp/top.tsv || echo "(集計失敗)"
          ALL_PATHS=$(jq 'length' /tmp/all.json)
          # --- stdout echo (log-readable, API can't fetch step summary) ---
          echo "STDOUT_TOTALS visits=${ALL_VISITS} requests=${ALL_REQ} paths=${ALL_PATHS}"
          # --- 国の内訳（合算） ---
          jq -r '[ group_by(.dimensions.clientCountryName)[]
                   | { k: .[0].dimensions.clientCountryName, v: ([.[].sum.visits] | add) } ]
                 | sort_by(-.v) | .[:10] | .[] | "\(.v)\t\(.k)"' \
            /tmp/all-clientCountryName.json > /tmp/country.tsv || true
          JP=$(jq '[.[] | select(.dimensions.clientCountryName == "JP") | .sum.visits] | add // 0' \
            /tmp/all-clientCountryName.json)
          # --- ブラウザの内訳（合算） ---
          jq -r '[ group_by(.dimensions.userAgentBrowser)[]
                   | { k: .[0].dimensions.userAgentBrowser, v: ([.[].sum.visits] | add) } ]
                 | sort_by(-.v) | .[:12] | .[] | "\(.v)\t\(.k)"' \
            /tmp/all-userAgentBrowser.json > /tmp/browser.tsv || true
          # **実ブラウザだけを足す。** Bot / Crawl / Spider / Unknown を除く。
          # 「Unknown」は User-Agent を name 付きで送っていないもの＝ほぼ自動化。
          HUMAN=$(jq '[.[] | select((.dimensions.userAgentBrowser
                        | test("bot|crawl|spider|slurp|Unknown|HeadlessChrome"; "i")) | not)
                      | .sum.visits] | add // 0' /tmp/all-userAgentBrowser.json)
          echo "STDOUT_HUMAN jp=${JP} real_browser=${HUMAN} of_total=${ALL_VISITS}"
          echo "STDOUT_COUNTRY_START"; cat /tmp/country.tsv || true; echo "STDOUT_COUNTRY_END"
          echo "STDOUT_BROWSER_START"; cat /tmp/browser.tsv || true; echo "STDOUT_BROWSER_END"
          echo "STDOUT_TOP_START"
          cat /tmp/top.tsv || true
          echo "STDOUT_TOP_END"
          {
            echo "# Weekly PV Report — ${HOST}"
            echo
            echo "**Window**: ${START} → ${END} (${DAYS}日)"
            echo
            echo "- 全パス数: ${ALL_PATHS}"
            echo "- 総 visits: ${ALL_VISITS}"
            echo "- 総 requests: ${ALL_REQ}"
            echo "- **うち日本から: ${JP}**"
            echo "- **うち実ブラウザ（ボットを除く）: ${HUMAN}**"
            echo
            echo "> **総 visits は読者数ではない。** ボットとクローラを含む。"
            echo "> **読者数として読むのは「実ブラウザ」の行。** 検索からの実訪問は GSC のクリック数を見る。"
            echo
            echo "### 国（visits 上位10）"
            echo
            echo "| visits | 国 |"
            echo "|---|---|"
            while IFS=$'\t' read -r v k; do echo "| ${v} | ${k} |"; done < /tmp/country.tsv
            echo
            echo "### ブラウザ（visits 上位12）"
            echo
            echo "| visits | UA |"
            echo "|---|---|"
            while IFS=$'\t' read -r v k; do echo "| ${v} | ${k} |"; done < /tmp/browser.tsv
            echo
            echo "## Top 25 posts by visits"
            echo
            echo "| 順 | visits | requests | path |"
            echo "|---|---|---|---|"
            i=0
            while IFS=$'\t' read -r v c p; do
              i=$((i+1))
              echo "| ${i} | ${v} | ${c} | \`${p}\` |"
            done < /tmp/top.tsv
            echo
            echo "---"
            echo "RAW（先頭 60 行だけ。**全部 貼ると 30 日ぶんで膨らむ**）"
            echo '```json'
            ( jq '.' /tmp/all.json 2>/dev/null | head -60 ) || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Optional Slack post (if SLACK_WEBHOOK_URL set)
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          {
            echo "*Weekly PV Report — ${HOST} (${DAYS}日)*"
            echo '```'
            echo "rank visits  path"
            i=0
            while IFS=$'\t' read -r v r p; do
              i=$((i+1)); printf "%-4d %-7s %s\n" "$i" "$v" "$p"
            done < /tmp/top.tsv
            echo '```'
          } > /tmp/msg
          jq -Rs --arg c "$(cat /tmp/msg)" '{text:$c}' < /dev/null > /tmp/payload.json
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H "Content-Type: application/json" --data @/tmp/payload.json
