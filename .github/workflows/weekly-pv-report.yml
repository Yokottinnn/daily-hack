name: weekly-pv-report

# 週次で Cloudflare Zone Analytics から PV 上位 25 ページを取得し
# Actions の Step Summary（タブ「Summary」）に整形して掲載する。
# 月曜 朝7時 JST に自動実行 + 任意で workflow_dispatch から手動起動可能。

on:
  schedule:
    - cron: '0 22 * * 0'   # 毎週日曜 22:00 UTC = 月曜 07:00 JST
  workflow_dispatch:
    inputs:
      days:
        description: '集計対象日数（デフォ7）'
        required: false
        default: '7'

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: daily-hack.fieldbeside.com
      DOMAIN: fieldbeside.com
      DAYS: ${{ github.event.inputs.days || '7' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Cloudflare zone id
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=${DOMAIN}" \
            -H "Authorization: Bearer ${CF_TOKEN}" | jq -r '.result[0].id')
          echo "zone_id=${ZONE_ID}" >> "$GITHUB_ENV"
          echo "Resolved zone_id=${ZONE_ID}"

      - name: Query Zone Analytics (GraphQL, 1日ループ集計)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # httpRequestsAdaptiveGroups は zone あたり 1d 制限なので日次ループ
          END_EPOCH=$(date -u +%s)
          read -r -d '' QUERY <<'GQL' || true
          query($zoneTag: String!, $start: Time!, $end: Time!, $host: String!) {
            viewer {
              zones(filter: { zoneTag: $zoneTag }) {
                httpRequestsAdaptiveGroups(
                  limit: 200,
                  filter: {
                    datetime_geq: $start,
                    datetime_leq: $end,
                    clientRequestHTTPHost: $host,
                    edgeResponseStatus: 200,
                    requestSource: "eyeball"
                  },
                  orderBy: [sum_visits_DESC]
                ) {
                  sum { visits }
                  count
                  dimensions { clientRequestPath }
                }
              }
            }
          }
          GQL
          echo "[]" > /tmp/all.json  # 累積バッファ
          ALL_VISITS=0; ALL_REQ=0
          for d in $(seq "${DAYS}" -1 1); do
            END_T=$(date -u -d "-$((d-1)) days" +%FT00:00:00Z)
            START_T=$(date -u -d "-${d} days" +%FT00:00:00Z)
            jq -n --arg q "$QUERY" --arg zone "$zone_id" --arg start "$START_T" --arg end "$END_T" --arg host "$HOST" \
              '{query:$q, variables:{zoneTag:$zone, start:$start, end:$end, host:$host}}' > /tmp/q.json
            curl -s https://api.cloudflare.com/client/v4/graphql \
              -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
              --data-binary @/tmp/q.json > /tmp/day.json
            echo "── ${START_T} → ${END_T} ──"
            jq '.errors // empty' /tmp/day.json
            # 蓄積は必ずファイル経由で渡す。--argjson に流し込むと日数が増えた時点で
            # ARG_MAX を超え "jq: Argument list too long" で落ちる（2026-08-16/17 の実障害）
            jq '.data.viewer.zones[0].httpRequestsAdaptiveGroups // []' /tmp/day.json > /tmp/day_rows.json
            jq -s '.[0] + .[1]' /tmp/all.json /tmp/day_rows.json > /tmp/all.next.json
            mv /tmp/all.next.json /tmp/all.json
            v=$(jq '[.[].sum.visits] | add // 0' /tmp/day_rows.json)
            r=$(jq '[.[].count] | add // 0' /tmp/day_rows.json)
            ALL_VISITS=$((ALL_VISITS + v))
            ALL_REQ=$((ALL_REQ + r))
          done
          START="$(date -u -d "-${DAYS} days" +%FT00:00:00Z)"
          END="$(date -u +%FT%TZ)"
          # 同一パスを合算（複数日にわたるため）
          jq '
            [ group_by(.dimensions.clientRequestPath)[]
              | { dimensions: { clientRequestPath: .[0].dimensions.clientRequestPath },
                  sum: { visits: ([.[].sum.visits] | add) },
                  count: ([.[].count] | add) }
            ]
            | map(select(.dimensions.clientRequestPath | startswith("/posts/")))
            | sort_by(.sum.visits) | reverse | .[:25]
            | .[] | "\(.sum.visits)\t\(.count)\t\(.dimensions.clientRequestPath)"
          ' -r /tmp/all.json > /tmp/top.tsv || echo "(集計失敗)"
          ALL_PATHS=$(jq 'length' /tmp/all.json)
          # 後続ステップ（スナップショット保存・Slack 通知）は別シェルなので引き渡す
          {
            echo "ALL_VISITS=${ALL_VISITS}"
            echo "ALL_REQ=${ALL_REQ}"
            echo "ALL_PATHS=${ALL_PATHS}"
          } >> "$GITHUB_ENV"
          # --- stdout echo (log-readable, API can't fetch step summary) ---
          echo "STDOUT_TOTALS visits=${ALL_VISITS} requests=${ALL_REQ} paths=${ALL_PATHS}"
          echo "STDOUT_TOP_START"
          cat /tmp/top.tsv || true
          echo "STDOUT_TOP_END"
          {
            echo "# Weekly PV Report — ${HOST}"
            echo
            echo "**Window**: ${START} → ${END} (${DAYS}日)"
            echo
            echo "- 全パス数: ${ALL_PATHS}"
            echo "- 総 visits: ${ALL_VISITS}"
            echo "- 総 requests: ${ALL_REQ}"
            echo
            echo "## Top 25 posts by visits"
            echo
            echo "| 順 | visits | requests | path |"
            echo "|---|---|---|---|"
            i=0
            while IFS=$'\t' read -r v c p; do
              i=$((i+1))
              echo "| ${i} | ${v} | ${c} | \`${p}\` |"
            done < /tmp/top.tsv
            echo
            echo "---"
            echo "RAW GraphQL response (deburrable):"
            echo '```json'
            ( jq '.' /tmp/all.json 2>/dev/null | head -200 ) || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Referrer breakdown (X からの遷移を実測)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # 参照元の計測は「取れたら出す」。ここが落ちても PV レポートは壊さない
          set -uo pipefail
          CF=https://api.cloudflare.com/client/v4/graphql
          post() { curl -s "$CF" -H "Authorization: Bearer ${CF_TOKEN}" \
                     -H "Content-Type: application/json" --data-binary @"$1"; }

          # 1) 次元名を推測しない。introspection で実在するものを確かめる
          jq -n '{query:"{ __type(name: \"ZoneHttpRequestsAdaptiveGroupsDimensions\") { fields { name } } }"}' > /tmp/i.json
          post /tmp/i.json > /tmp/idim.json
          REF_FIELD=$(jq -r '[.data.__type.fields[]?.name | select(test("[Rr]eferer|[Rr]eferrer"))] | .[0] // empty' /tmp/idim.json)
          if [ -z "$REF_FIELD" ]; then
            echo "REFERER_UNSUPPORTED: スキーマに参照元の次元が無い"
            jq -r '[.data.__type.fields[]?.name] | join(", ")' /tmp/idim.json | head -c 2000
            echo
            echo "→ X からの遷移は GA4 など別の計測でしか取れない" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "REFERER_FIELD=${REF_FIELD}"

          # 2) 日次ループで参照元別に集計（1d 制限は PV 側と同じ）
          echo "[]" > /tmp/ref_all.json
          for d in $(seq "${DAYS}" -1 1); do
            END_T=$(date -u -d "-$((d-1)) days" +%FT00:00:00Z)
            START_T=$(date -u -d "-${d} days" +%FT00:00:00Z)
            jq -n --arg zone "$zone_id" --arg start "$START_T" --arg end "$END_T" --arg host "$HOST" --arg rf "$REF_FIELD" '
              {query: ("query($zoneTag:String!,$start:Time!,$end:Time!,$host:String!){viewer{zones(filter:{zoneTag:$zoneTag}){httpRequestsAdaptiveGroups(limit:100,filter:{datetime_geq:$start,datetime_leq:$end,clientRequestHTTPHost:$host,edgeResponseStatus:200,requestSource:\"eyeball\"},orderBy:[sum_visits_DESC]){sum{visits} dimensions{" + $rf + "}}}}}"),
               variables:{zoneTag:$zone,start:$start,end:$end,host:$host}}' > /tmp/rq.json
            post /tmp/rq.json > /tmp/rday.json
            # エラーを握り潰して 0 を出さない。取得できていないのに「遷移 0」と読める
            # 数字を出すのは、計測が無いことより有害
            ERR=$(jq -r '.errors[0].message // empty' /tmp/rday.json)
            if [ -n "$ERR" ]; then
              echo "REFERER_UNSUPPORTED: ${ERR}"
              {
                echo
                echo "## 参照元（X からの遷移）"
                echo
                echo "**このゾーンでは取得できない。** Cloudflare の応答:"
                echo
                echo "> ${ERR}"
                echo
                echo "次元 \`${REF_FIELD}\` はスキーマに存在するが、プランがアクセスを許可していない。"
                echo "X からの遷移を実測するには GA4 など別の計測が要る。"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            jq '.data.viewer.zones[0].httpRequestsAdaptiveGroups // []' /tmp/rday.json > /tmp/rrows.json
            jq -s '.[0] + .[1]' /tmp/ref_all.json /tmp/rrows.json > /tmp/ref_next.json
            mv /tmp/ref_next.json /tmp/ref_all.json
          done

          # 3) 参照元ホスト単位でまとめ、X 系（x.com / twitter / t.co）を合算して出す
          jq -r --arg rf "$REF_FIELD" '
            [ .[] | { ref: (.dimensions[$rf] // "" | ascii_downcase), v: .sum.visits } ]
            | map(.host = (if .ref == "" then "(direct/none)"
                           else (.ref | sub("^https?://";"") | split("/")[0]) end))
            | group_by(.host)[] | { host: .[0].host, visits: ([.[].v] | add) }
          ' /tmp/ref_all.json | jq -s 'sort_by(-.visits)' > /tmp/ref_top.json
          X_VISITS=$(jq '[.[] | select(.host | test("(^|\\.)(x\\.com|twitter\\.com|t\\.co)$")) | .visits] | add // 0' /tmp/ref_top.json)
          echo "STDOUT_X_REFERRAL visits=${X_VISITS}"
          echo "X_VISITS=${X_VISITS}" >> "$GITHUB_ENV"
          {
            echo
            echo "## 参照元（${DAYS}日・次元 \`${REF_FIELD}\`）"
            echo
            echo "- **X（x.com / twitter.com / t.co）からの遷移: ${X_VISITS} visits**"
            echo
            echo "| visits | 参照元ホスト |"
            echo "|---|---|"
            jq -r '.[:15][] | "| \(.visits) | `\(.host)` |"' /tmp/ref_top.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist snapshot (Cloudflare は 7 日で消えるため必ず残す)
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          SNAP="docs/analytics/weekly/${DATE}.md"
          {
            echo "# 週次アクセススナップショット ${DATE}"
            echo
            echo "- 集計期間: 直近 ${DAYS} 日（Cloudflare Zone Analytics）"
            echo "- 総 visits: ${ALL_VISITS:-unknown}"
            echo "- 総 requests: ${ALL_REQ:-unknown}"
            echo
            echo "| visits | requests | path |"
            echo "|---|---|---|"
            while IFS=$'\t' read -r v c pth; do
              echo "| ${v} | ${c} | \`${pth}\` |"
            done < /tmp/top.tsv
          } > /tmp/snap.md

          # データ用ブランチに積む。main は保護されているので直接は入れない
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin analytics/weekly >/dev/null 2>&1; then
            git fetch -q --depth=1 origin analytics/weekly
            git checkout -q -B analytics/weekly FETCH_HEAD
          else
            git checkout -q -B analytics/weekly
          fi
          mkdir -p docs/analytics/weekly
          cp /tmp/snap.md "$SNAP"

          # 推移を 1 行 1 週で追えるように CSV も更新する
          CSV=docs/analytics/weekly/history.csv
          [ -f "$CSV" ] || echo "date,days,visits,requests,paths" > "$CSV"
          grep -v "^${DATE}," "$CSV" > /tmp/csv.new || true
          echo "${DATE},${DAYS},${ALL_VISITS:-},${ALL_REQ:-},${ALL_PATHS:-}" >> /tmp/csv.new
          mv /tmp/csv.new "$CSV"

          git add docs/analytics/weekly
          if git diff --cached --quiet; then
            echo "変化なし。commit は省略"
          else
            git commit -q -m "analytics: ${DATE} の週次スナップショット（${DAYS}日 / visits ${ALL_VISITS:-?}）"
            git push -q origin HEAD:analytics/weekly
            echo "analytics/weekly に push した: ${SNAP}"
          fi

      - name: Notify Slack (必須。通知できなければジョブを失敗させる)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # 黙ってスキップしない。ここを if 条件で握り潰していたため、
          # このワークフローは一度も Slack に投稿できていなかった（2026-08-22 に判明）
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL が未設定。週次レポートを届けられない" >&2
            exit 1
          fi
          {
            echo "<@U0A5V22PVTQ> :bar_chart: *ブログ週次アクセス（直近 ${DAYS} 日）*"
            echo
            if [ "${ALL_VISITS:-0}" = "0" ]; then
              echo ":rotating_light: *visits が 0。取得に失敗している可能性が高い* — ログを確認してください"
            else
              echo "• PV: *${ALL_VISITS} visits* / ${ALL_REQ} requests"
            fi
            echo "• 記事ページ Top5"
            echo '```'
            head -5 /tmp/top.tsv | while IFS=$'\t' read -r v c pth; do
              printf "%-6s %s\n" "$v" "$pth"
            done
            echo '```'
            if [ -s /tmp/ref_top.json ]; then
              echo "• X からの遷移: ${X_VISITS:-未計測} visits"
            else
              echo "• X からの遷移: *取得不可*（Cloudflare のプランが参照元次元を許可していない）"
            fi
            echo
            echo ":warning: *Cloudflare は 7 日より古いデータを返さない。* ここで毎週記録しないと後から取り戻せない。"
            echo "記録先: \`analytics/weekly\` ブランチ / \`docs/analytics/weekly/\`"
            echo "実行ログ: ${RUN_URL}"
          } > /tmp/msg
          jq -Rs '{text: .}' < /tmp/msg > /tmp/payload.json
          HTTP=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X POST "$SLACK_WEBHOOK_URL" \
                   -H "Content-Type: application/json" --data @/tmp/payload.json)
          echo "Slack HTTP ${HTTP}: $(cat /tmp/resp.txt)"
          [ "$HTTP" = "200" ] || exit 1
