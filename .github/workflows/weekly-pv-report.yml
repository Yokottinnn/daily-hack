name: Weekly PV Report

on:
  schedule:
    # 毎週月曜 09:00 JST = 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Slack には投稿せず標準出力のみ"
        required: false
        type: boolean
        default: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: weekly-pv-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Run weekly PV report
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            # SLACK_WEBHOOK_URL は env では渡すが、本スクリプトの post 部分は無効化
            python -c "
          import os, sys
          sys.path.insert(0, 'scripts')
          from weekly_pv_report import make_client, query_ga4, build_slack_text
          from datetime import datetime, timedelta, timezone
          today = datetime.now(timezone.utc).date()
          end = (today - timedelta(days=1)).isoformat(); start = (today - timedelta(days=7)).isoformat()
          client = make_client(os.environ['GA4_SERVICE_ACCOUNT_JSON'])
          reports = query_ga4(client, os.environ['GA4_PROPERTY_ID'], start, end)
          print(build_slack_text(reports, start, end))
          "
          else
            python scripts/weekly_pv_report.py
          fi
