name: Test Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Astro build
        run: npm run build
        env:
          PUBLIC_CLARITY_PROJECT_ID: ${{ vars.PUBLIC_CLARITY_PROJECT_ID }}
          PUBLIC_GA4_MEASUREMENT_ID: ${{ vars.PUBLIC_GA4_MEASUREMENT_ID }}
          PUBLIC_INCLUDE_DRAFTS: ${{ github.event_name == 'pull_request' && 'true' || '' }}
      - name: Verify dist directory
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          echo "Build succeeded: $(find dist -type f | wc -l) files"
      - name: Astro type check
        run: npx astro check --minimumSeverity error

      # **記事の品質チェックを CI に入れる（2026-09-14）。**
      #
      # `check-article-ux.py` は 2026-08-09 からあったが、**呼んでいる場所が
      # どこにも無かった。** 書いている本人が 1 ファイルを手で指定したときしか
      # 走らず、ルールが出来る前に書かれた記事には一度も当たっていなかった。
      # 2026-09-14 に全記事へ当てたら 74 本中 63 本に指摘が出た。
      #
      # 積み残しは docs/article-ux-baseline.json に記録し、**新しく増えた指摘だけ**
      # で落とす。新記事は指摘ゼロ、既存記事は悪化させられない、が両立する。
      - name: Article quality check
        run: |
          python3 scripts/check-article-ux.py --baseline
          python3 scripts/check-md-bold.py dist/posts/*/index.html

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=daily-hack --branch=${{ github.head_ref || github.ref_name }} --commit-hash=${{ github.sha }} --commit-message="Deploy ${{ github.sha }}"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const url = `${{ steps.deploy.outputs.deployment-url }}`;
            if (url) {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `🚀 Preview deployment: ${url}\n\nThis preview will be updated when new commits are pushed to this branch.`,
              });
            }
