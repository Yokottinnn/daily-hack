name: ops-watchdog

# Mac 側の X 運用が止まっていないかを GitHub 側から監視する。
#
# 監視を Mac に置くと Mac が死んだとき監視も死ぬ。実際 2026-08-10 に Chrome の
# 自動更新で全ジョブが停止したが、検知役の pipeline-heartbeat も同じ Mac で
# 止まっており 5 日間 誰も気づかなかった。
#
# そこで Mac 側は 30 分ごとに ops/heartbeat ブランチへ稼働状況を push するだけにし、
# 「来なくなったこと」をここで検知する（dead-man's-switch）。
# Mac が丸ごと落ちても、押されないこと自体が異常の証拠になる。

on:
  schedule:
    - cron: '20 */2 * * *'   # 2時間ごと
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # heartbeat がこの分数より古ければ異常とみなす（押す側は30分間隔）
      STALE_MINUTES: '90'
      # 稼働していてほしいジョブ。poll-approvals は滞留対策で意図的に外している。
      #
      # **フォロワーを増やすジョブが 1 つも入っていなかった。**
      # そのため competitor-follower-follow は 2026-07-07 に壊れてから 46 日間、
      # 誰にも検知されずに止まり続けた。badge-followback も 8/09 から 13 日間 同様。
      # フォロワーは 8/09 の 206 から 8/21 の 207 へ、12 日で +1 しか動いていない。
      #
      # 監視が「載っているジョブが動いているか」しか見ておらず、
      # **「あるべきものが消えていること」を見ていなかった。** ここに入れて初めて鳴る。
      EXPECTED_JOBS: >-
        ai.openclaw.comment-warmup
        ai.openclaw.incoming-reply-watcher
        ai.openclaw.gateway
        ai.openclaw.node
        ai.openclaw.badge-followback
        ai.openclaw.follower-snapshot
        ai.openclaw.competitor-follower-follow
        ai.openclaw.hashtag-follow
      # OAuth の残り時間がこれを切ったら、失効「前」に鳴らす
      AUTH_WARN_HOURS: '24'
      # comment-warmup は 03/07/10/13 UTC に発火する。この時刻を過ぎて投稿ゼロなら、
      # ジョブは載っているのに実際は動いていない（＝今回の事故と同じ形）
      ACTIVITY_CHECK_AFTER_UTC_HOUR: '14'
      # 実際の増加が「目標に必要なペース」の何 % を下回ったら鳴らすか。
      #
      # **「増加ゼロなら鳴らす」では足りない。** 8/09→8/21 は 12 日で +1 で、
      # ゼロではないが完全な停滞だった。7/07〜8/09 の competitor-follower-follow は
      # ジョブが載ったまま CDP 断で 1 件も実行されず、それでも数値はわずかに動く。
      # ゼロ判定はこの形を通してしまう。目標ペースとの比で見る。
      FOLLOWER_PACE_MIN_PCT: '25'
    steps:
      - name: Fetch heartbeat branch
        id: fetch
        run: |
          set -uo pipefail
          if git clone --depth 1 --branch ops/heartbeat \
               "https://github.com/${GITHUB_REPOSITORY}.git" hb 2>/dev/null; then
            echo "found=yes" >> "$GITHUB_OUTPUT"
          else
            echo "found=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Not set up yet
        if: steps.fetch.outputs.found != 'yes'
        run: |
          # ブランチが無い＝まだ Mac 側に登録されていない。
          # ここで Slack に鳴らすと登録前に毎回鳴り続けるので、記録だけ残す。
          {
            echo "### ops-watchdog: 未設定"
            echo ""
            echo "\`ops/heartbeat\` ブランチが存在しない。Mac 側で 30 分ごとに"
            echo "\`scripts/ops-heartbeat.sh\` を実行する launchd ジョブを登録すると監視が始まる。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Evaluate
        if: steps.fetch.outputs.found == 'yes'
        id: evaluate
        env:
          # 値そのものは使わない。**登録されているかどうかだけ**を見る。
          # 未登録なら鳴らせないので、それ自体を異常として扱う。
          SLACK_CHECK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          gen=$(jq -r '.generated_at' hb/heartbeat.json)
          host=$(jq -r '.host' hb/heartbeat.json)
          jobs=$(jq -r '.jobs[]?' hb/heartbeat.json | sort)

          age=$(( ( $(date -u +%s) - $(date -u -d "$gen" +%s) ) / 60 ))

          missing=""
          for want in $EXPECTED_JOBS; do
            printf '%s\n' "$jobs" | grep -qx "$want" || missing="$missing $want"
          done

          # 認証の状態。2026-08-15 に OAuth 失効で Mac が 2時間半 無応答になったが、
          # 「返事が来ない」以外に症状が無く、誰も気づけなかった。
          # 失効してから騒ぐのでは遅いので、期限が近いうちにも鳴らす。
          # jq の `//` は false を「欠損」とみなすため、ここで使うと
          # auth.ok=false（＝まさに検知したい状態）が握り潰される。tostring を使う。
          auth_ok=$(jq -r '.auth.ok | tostring' hb/heartbeat.json)
          auth_exp=$(jq -r '.auth.expires_at | tostring' hb/heartbeat.json)
          auth_detail=$(jq -r '.auth.detail // ""' hb/heartbeat.json)
          auth_hours=""
          if [ "$auth_exp" != "null" ] && [ -n "$auth_exp" ]; then
            auth_hours=$(( ( $(date -u -d "$auth_exp" +%s) - $(date -u +%s) ) / 3600 ))
          fi

          # 本日の実投稿数。**ジョブが載っていることは動いている証拠にならない。**
          # 「載っているのに 0 件」がまさに今回の事故の形なので、そこを鳴らす。
          posted=$(jq -r '.activity.posted_today // 0' hb/heartbeat.json)
          act_detail=$(jq -r '.activity.detail // "欄なし"' hb/heartbeat.json)
          act_sources=$(jq -r '[.activity.sources[]? | "\(.file)=\(.count)"] | join(" ")' hb/heartbeat.json)

          # **名前を列挙せずに「消えたジョブ」を捕まえる。**
          # EXPECTED_JOBS は手で保守するリストなので、足し忘れたジョブは
          # 「消えても気づかれないジョブ」になる。実際 competitor-follower-follow は
          # リストに無く、46 日間 誰にも検知されなかった。
          # heartbeat 側が「plist はあるのに載っていない」を全部出すので、ここで鳴らす。
          unloaded_n=$(jq -r '.unloaded_count // 0' hb/heartbeat.json)
          unloaded_list=$(jq -r '[.unloaded[]?.label] | join(" ")' hb/heartbeat.json)

          # **成果そのもの。** ジョブが載っていても CDP が落ちていれば 0 件実行になる。
          # 壊れ方を知らなくても、未知のジョブが死んでも、ここで必ず捕まる。
          f_now=$(jq -r '.followers.now | tostring' hb/heartbeat.json)
          f_prev=$(jq -r '.followers.prev | tostring' hb/heartbeat.json)
          f_target=$(jq -r '.followers.target | tostring' hb/heartbeat.json)
          f_deadline=$(jq -r '.followers.deadline // ""' hb/heartbeat.json)
          f_span=$(jq -r '.followers.span_days | tostring' hb/heartbeat.json)
          f_delta=""
          f_need=""
          # **判定不能を「増えていない」と混同しない。** 日付が読めず span が出ない
          # ときは delta を出さず、下の nogrowth 判定ごと飛ばす。
          if [ "$f_now" != "null" ] && [ "$f_prev" != "null" ] \
             && [ "$f_span" != "null" ] && [ "$f_span" -ge 3 ] 2>/dev/null; then
            f_delta=$(( f_now - f_prev ))
          fi
          if [ "$f_now" != "null" ] && [ "$f_target" != "null" ] && [ -n "$f_deadline" ]; then
            days_left=$(( ( $(date -u -d "$f_deadline" +%s) - $(date -u +%s) ) / 86400 ))
            [ "$days_left" -lt 1 ] && days_left=1
            f_need=$(( ( f_target - f_now ) / days_left ))
          fi

          {
            echo "### ops-watchdog"
            echo ""
            echo "- host: \`$host\`"
            echo "- heartbeat: \`$gen\`（${age} 分前）"
            echo "- 稼働ジョブ: $(printf '%s\n' "$jobs" | grep -c . || true) 件"
            [ -n "$missing" ] && echo "- **欠落:**$missing"
            echo "- **plist はあるのに未ロード: ${unloaded_n} 件**${unloaded_list:+ — $unloaded_list}"
            echo "- 認証: \`$auth_ok\`（$auth_detail）${auth_hours:+ / 残り ${auth_hours} 時間}"
            echo "- 本日の投稿: **${posted} 件**（$act_detail）${act_sources:+ / $act_sources}"
            echo "- フォロワー: **${f_now}**${f_delta:+（${f_span} 日で ${f_delta} 人）}${f_target:+ / 目標 ${f_target}}${f_deadline:+ まで ${f_deadline}}${f_need:+ / 必要 ${f_need} 人＋/日}"
          } >> "$GITHUB_STEP_SUMMARY"

          problem=""
          [ "$age" -gt "$STALE_MINUTES" ] && problem="stale"
          [ -n "$missing" ] && problem="${problem:+$problem,}missing"
          # 失効済み
          [ "$auth_ok" = "false" ] && problem="${problem:+$problem,}auth"
          # 失効前の警告。ここで鳴らせば、切れる前に /login できる
          if [ -n "$auth_hours" ] && [ "$auth_hours" -lt "$AUTH_WARN_HOURS" ] \
             && [ "$auth_ok" != "false" ]; then
            problem="${problem:+$problem,}auth_soon"
          fi
          # 載っているのに打てていない。ログを実際に走査できた場合だけ判定する
          # （判定不能を 0 件と混同しない）。発火時刻を過ぎてから見る。
          if [ "$act_detail" = "ログを走査した" ] && [ "$posted" -eq 0 ] \
             && [ "$(date -u +%H)" -ge "$ACTIVITY_CHECK_AFTER_UTC_HOUR" ] \
             && printf '%s\n' "$jobs" | grep -q 'comment-warmup'; then
            problem="${problem:+$problem,}silent"
          fi
          # plist はあるのに載っていない＝止まっている。名前を知らなくても捕まる
          [ "$unloaded_n" -gt 0 ] && problem="${problem:+$problem,}unloaded"
          # 成果が動いていない。ジョブの生死をすり抜けた故障はここで捕まる。
          # 実測 delta 人 / span 日 が、必要ペース need 人/日 の
          # FOLLOWER_PACE_MIN_PCT % を下回ったら鳴らす。
          # 目標を既に達成している（need <= 0）ときは判定しない。
          if [ -n "$f_delta" ] && [ -n "$f_need" ] && [ "$f_need" -gt 0 ] 2>/dev/null; then
            if [ $(( f_delta * 100 )) -lt $(( f_need * f_span * FOLLOWER_PACE_MIN_PCT )) ]; then
              problem="${problem:+$problem,}nogrowth"
            fi
          fi
          # **警告経路そのものが死んでいないか。** 2026-08-22 まで SLACK_WEBHOOK_URL が
          # 未設定で、87 回の検知が 1 度も配達されていなかった。
          # 「鳴らない監視」は監視ゼロと同じなので、それ自体を異常として扱う。
          if [ -z "${SLACK_CHECK:-}" ]; then
            problem="${problem:+$problem,}nowebhook"
          fi

          {
            echo "age=$age"
            echo "host=$host"
            echo "gen=$gen"
            echo "missing=$missing"
            echo "auth_ok=$auth_ok"
            echo "auth_detail=$auth_detail"
            echo "auth_hours=$auth_hours"
            echo "posted=$posted"
            echo "unloaded_n=$unloaded_n"
            echo "unloaded_list=$unloaded_list"
            echo "f_now=$f_now"
            echo "f_delta=$f_delta"
            echo "f_span=$f_span"
            echo "f_need=$f_need"
            echo "problem=$problem"
          } >> "$GITHUB_OUTPUT"

      - name: Alert Slack
        if: steps.evaluate.outputs.problem != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          AGE: ${{ steps.evaluate.outputs.age }}
          HOST: ${{ steps.evaluate.outputs.host }}
          GEN: ${{ steps.evaluate.outputs.gen }}
          MISSING: ${{ steps.evaluate.outputs.missing }}
          AUTH_DETAIL: ${{ steps.evaluate.outputs.auth_detail }}
          AUTH_HOURS: ${{ steps.evaluate.outputs.auth_hours }}
          POSTED: ${{ steps.evaluate.outputs.posted }}
          PROBLEM: ${{ steps.evaluate.outputs.problem }}
          UNLOADED_N: ${{ steps.evaluate.outputs.unloaded_n }}
          UNLOADED_LIST: ${{ steps.evaluate.outputs.unloaded_list }}
          F_NOW: ${{ steps.evaluate.outputs.f_now }}
          F_DELTA: ${{ steps.evaluate.outputs.f_delta }}
          F_SPAN: ${{ steps.evaluate.outputs.f_span }}
          F_NEED: ${{ steps.evaluate.outputs.f_need }}
        run: |
          set -uo pipefail
          # **本文を先に組み立てる。** 2026-08-22 まで、シークレット未設定のときに
          # 本文を作る前に exit 1 していたため、「何が異常なのか」がどこにも
          # 残らなかった。検知は 87 回動いていたのに、中身は一度も読めていない。
          {
            echo "🚨 *X運用の異常を検知（GitHub Actions からの外部監視）*"
            echo ""
            case "$PROBLEM" in
              *stale*)
                echo "• *heartbeat が ${AGE} 分前で止まっている*（${STALE_MINUTES}分が閾値）"
                echo "  Mac 側が丸ごと落ちている可能性がある。"
                ;;
            esac
            case "$PROBLEM" in
              *missing*)
                echo "• *停止しているジョブ:*${MISSING}"
                ;;
            esac
            case "$PROBLEM" in
              *auth_soon*)
                echo "• *Claude の認証があと ${AUTH_HOURS} 時間で失効する*"
                echo "  切れる前に Mac の claude で \`/login\` を実行すること。"
                ;;
              *auth*)
                echo "• *Claude の認証が失効している*（${AUTH_DETAIL}）"
                echo "  Mac のセッションは何を送っても返さない状態。\`/login\` が必要。"
                ;;
            esac
            case "$PROBLEM" in
              *silent*)
                echo "• *ジョブは載っているのに、本日の投稿が 0 件*"
                echo "  comment-warmup は稼働中の扱いだが実際は打てていない。"
                echo "  認証切れ・生成失敗・X へのログイン切れのいずれかを疑う。"
                ;;
            esac
            case "$PROBLEM" in
              *unloaded*)
                echo "• *plist はあるのに launchctl に載っていないジョブが ${UNLOADED_N} 件*"
                echo "  ${UNLOADED_LIST}"
                echo "  止めたいなら plist を .disabled にリネームすること。"
                echo "  .plist のまま載っていないのは、意図せず落ちた状態。"
                ;;
            esac
            case "$PROBLEM" in
              *nogrowth*)
                echo "• *フォロワーが増えていない*（現在 ${F_NOW} / ${F_SPAN} 日で ${F_DELTA} 人）"
                echo "  目標には 1 日 ${F_NEED} 人 必要。"
                echo "  ジョブが載っていても実行できていない可能性がある"
                echo "  （2026-07-07 は Chrome CDP の接続断で 46 日間 0 件だった）。"
                ;;
            esac
            case "$PROBLEM" in
              *nowebhook*)
                echo "• *SLACK_WEBHOOK_URL が未登録。この通知は Slack に届いていない*"
                echo "  Settings → Secrets and variables → Actions で登録すること。"
                echo "  未登録の間、検知はすべて GitHub の実行画面にしか残らない。"
                ;;
            esac
            echo ""
            echo "最終 heartbeat: ${GEN} / host: ${HOST}"
            echo "復旧手順: docs/openclaw-recovery.md"
          } > msg.txt

          # **必ず GitHub 側にも残す。** Slack が死んでいても、失敗メールと
          # 実行画面から本文が読める状態にしておく。
          {
            echo ""
            echo "### 検知した異常"
            echo ""
            echo '```text'
            cat msg.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            {
              echo ""
              echo "> ⚠️ **\`SLACK_WEBHOOK_URL\` が未設定のため Slack へ送れていない。**"
              echo "> Settings → Secrets and variables → Actions で登録すると鳴るようになる。"
              echo "> 登録手順は \`docs/ops-watchdog.md\` を参照。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "SLACK_WEBHOOK_URL が未設定のため Slack へ通知できない（本文はサマリに出した）" >&2
            exit 0
          fi

          jq -Rs '{text: .}' msg.txt > payload.json
          curl -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' --data @payload.json

      - name: Fail the run when a problem was detected
        if: steps.evaluate.outputs.problem != ''
        run: |
          echo "problem=${{ steps.evaluate.outputs.problem }}" >&2
          exit 1
