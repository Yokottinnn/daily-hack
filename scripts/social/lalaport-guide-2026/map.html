<!doctype html>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 1200px; overflow: hidden;
    font-family: "IPAPGothic", "IPAGothic", sans-serif;
    background: radial-gradient(circle at 30% 8%, #1d3b5c 0%, #0e1c2e 62%);
    color: #fff; display: flex; flex-direction: column;
  }

  header { padding: 32px 52px 18px; }
  .kicker {
    display: inline-block; background: #e8384f; color: #fff;
    font-size: 23px; font-weight: bold; letter-spacing: .1em;
    padding: 7px 18px; border-radius: 999px; margin-bottom: 16px;
  }
  h1 { font-size: 66px; font-weight: bold; line-height: 1.1; letter-spacing: .005em; }
  h1 em { font-style: normal; color: #ffd166; }
  .sub { margin-top: 12px; font-size: 26px; color: #9fc0e0; }

  main { flex: 1; display: flex; gap: 20px; padding: 0 52px; }

  /* japan.png はクリーム地の不透明画像。反転せず、白カードとして暗背景に載せる。 */
  .mapbox {
    position: relative; width: 620px; flex: none; align-self: flex-start;
    border-radius: 18px; overflow: hidden;
    box-shadow: 0 10px 34px rgba(0,0,0,.5);
  }
  .mapbox img.jp {
    position: absolute; left: 0; top: 0; width: 100%;
    filter: saturate(1.35) contrast(1.04);
  }
  .dot {
    position: absolute; width: 17px; height: 17px; margin: -8.5px 0 0 -8.5px;
    background: #ff5a5a; border-radius: 50%;
    box-shadow: 0 0 0 5px rgba(255,90,90,.28), 0 0 16px rgba(255,90,90,.9);
  }
  .bubble {
    position: absolute; transform: translate(-50%, -50%);
    background: rgba(255,255,255,.97); color: #14243a;
    border-radius: 14px; padding: 7px 14px 8px; text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,.45);
  }
  .bubble .area { font-size: 21px; font-weight: bold; line-height: 1.1; }
  .bubble .n { font-size: 33px; font-weight: bold; color: #e8384f; line-height: 1.05; }
  .bubble .n small { font-size: 18px; color: #6b7c92; margin-left: 2px; }
  .ring {
    position: absolute; width: 62px; height: 62px; margin: -31px 0 0 -31px;
    border: 5px solid #e8384f; border-radius: 50%;
    background: rgba(232,56,79,.16);
    box-shadow: 0 0 18px rgba(232,56,79,.7);
  }
  .lead {
    position: absolute; left: 66.5%; top: 62.5%;
    width: 96px; height: 3px; background: #e8384f;
    transform: rotate(-24deg); transform-origin: left center;
  }
  .bubble.kanto { background: #ffd166; }
  .bubble.kanto .n { color: #b3341f; }

  aside { flex: 1; padding-top: 4px; }
  .panel-title { font-size: 24px; color: #9fc0e0; margin-bottom: 14px; letter-spacing: .06em; }
  .pref { display: flex; align-items: center; gap: 11px; margin-bottom: 10px; }
  .pname { width: 92px; flex: none; font-size: 26px; font-weight: bold; text-align: right; }
  .pbar { height: 22px; border-radius: 11px; background: linear-gradient(90deg, #ff6b4a, #ffd166); }
  .pnum { font-size: 24px; color: #cfe0f2; }

  .zero {
    margin-top: 22px; background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.18); border-radius: 14px; padding: 16px 18px;
  }
  .zero .h { font-size: 23px; font-weight: bold; color: #ffd166; margin-bottom: 8px; }
  .zero .b { font-size: 23px; line-height: 1.55; color: #dbe7f3; }

  .strip {
    display: flex; gap: 16px; padding: 20px 52px 0;
  }
  .fact {
    flex: 1; background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.16); border-radius: 14px;
    padding: 14px 18px 15px;
  }
  .fact .big { font-size: 40px; font-weight: bold; color: #ffd166; line-height: 1.05; }
  .fact .big small { font-size: 21px; color: #9fc0e0; margin-left: 3px; }
  .fact .lbl { margin-top: 5px; font-size: 21px; color: #dbe7f3; line-height: 1.35; }

  footer {
    padding: 16px 52px 20px; display: flex; align-items: center;
    justify-content: space-between; gap: 20px;
  }
  .src { font-size: 20px; color: #8fa9c4; line-height: 1.5; }
  .brand { display: flex; align-items: center; gap: 16px; flex: none; }
  .brand img { width: 62px; height: 62px; border-radius: 12px; background: #fff; }
  .brand .site { font-size: 27px; font-weight: bold; }
</style>

<header>
  <div class="kicker">全20施設の分布</div>
  <h1>ららぽーとがあるのは<br><em>9都府県だけ</em></h1>
  <div class="sub">関東に9施設。関西・東海で10施設。残りは福岡の1施設。</div>
</header>

<main>
  <div class="mapbox" id="mapbox">
    <img class="jp" src="../../../public/images/lalaport-guide-2026/map/japan.png" alt="">
  </div>

  <aside>
    <div class="panel-title">都府県別の施設数</div>
    <div id="prefs"></div>
  </aside>
</main>

<div class="strip">
  <div class="fact">
    <div class="big">9<small>／47</small></div>
    <div class="lbl">ららぽーとがある<br>都府県の数</div>
  </div>
  <div class="fact">
    <div class="big">45<small>%</small></div>
    <div class="lbl">関東1都3県に<br>集中している割合</div>
  </div>
  <div class="fact">
    <div class="big">0<small>施設</small></div>
    <div class="lbl">北海道・東北・北陸<br>中国・四国・沖縄</div>
  </div>
</div>

<footer>
  <div class="src">
    出典：三井不動産 決算説明資料および三井ショッピングパーク公式サイト<br>
    2026年8月時点の営業中20施設
  </div>
  <div class="brand">
    <img src="../../../public/images/point-service-complete-guide-2026/logos/mitsuisp.png" alt="三井ショッピングパーク">
    <div class="site">Daily Hack</div>
  </div>
</footer>

<script>
  // 記事の地図と同じドット座標（施設の実位置）。japan.png の枠に対する %。
  const dots = [
    [38.46, 74.87], [52.54, 74.66], [38.94, 76.62], [39.43, 74.32],
    [47.09, 72.41], [58.21, 72.36], [48.02, 72.48], [10.49, 82.02],
    [39.58, 75.97], [39.71, 74.78], [48.21, 73.32],
  ];
  // エリア集約の吹き出し。関東は japan.png 上の関東インセット枠の位置に置く。
  // 関東の9施設は japan.png 上では個別ドットを持たない（記事では別図に切り出している）
  // ため、関東の位置そのものに吹き出しを置く。他はドット群の近くに寄せる。
  const bubbles = [
    { area: "関東", n: 9, left: 80, top: 57, cls: "kanto" },
    { area: "東海", n: 5, left: 57, top: 88, cls: "" },
    { area: "関西", n: 5, left: 24, top: 66, cls: "" },
    { area: "九州", n: 1, left: 14, top: 89, cls: "" },
  ];
  // 関東の所在を示すリング（インセット枠の中心）
  const kantoRing = { left: 62.9, top: 69.3 };

  const box = document.getElementById("mapbox");
  const img = box.querySelector("img.jp");
  img.onload = () => {
    // 画像の実表示高さに合わせて枠の高さを決め、% 座標を正しく対応させる
    box.style.height = (box.clientWidth * img.naturalHeight / img.naturalWidth) + "px";
    dots.forEach(([l, t]) => {
      const d = document.createElement("div");
      d.className = "dot";
      d.style.left = l + "%"; d.style.top = t + "%";
      box.appendChild(d);
    });
    const ring = document.createElement("div");
    ring.className = "ring";
    ring.style.left = kantoRing.left + "%"; ring.style.top = kantoRing.top + "%";
    box.appendChild(ring);
    const lead = document.createElement("div");
    lead.className = "lead";
    box.appendChild(lead);

    bubbles.forEach(b => {
      const el = document.createElement("div");
      el.className = "bubble " + b.cls;
      el.style.left = b.left + "%"; el.style.top = b.top + "%";
      el.innerHTML = `<div class="area">${b.area}</div><div class="n">${b.n}<small>施設</small></div>`;
      box.appendChild(el);
    });
    document.body.dataset.ready = "1";
  };

  const prefs = [["大阪", 4], ["神奈川", 3], ["愛知", 3], ["千葉", 2],
                 ["東京", 2], ["静岡", 2], ["埼玉", 2], ["兵庫", 1], ["福岡", 1]];
  document.getElementById("prefs").innerHTML = prefs.map(([name, n]) => `
    <div class="pref">
      <div class="pname">${name}</div>
      <div class="pbar" style="width:${n * 42}px"></div>
      <div class="pnum">${n}</div>
    </div>`).join("");
</script>
