<title>X告知レビュー</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root {
    --paper:   #eef0f3;
    --surface: #ffffff;
    --sunk:    #e4e7ec;
    --ink:     #15181c;
    --muted:   #646b74;
    --line:    #d3d8df;
    --accent:  #cf2740;
    --accent-ink: #ffffff;
    --mark:    #ffe08a;
    --mark-ink: #15181c;
    --done:    #3c7a5e;
    --shadow:  0 1px 2px rgba(20,24,30,.06), 0 8px 24px -14px rgba(20,24,30,.35);

    --jp: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#121417; --surface:#1a1d21; --sunk:#101215; --ink:#e8eaed; --muted:#969ca5;
      --line:#2b2f35; --accent:#ff5c72; --accent-ink:#1a0007;
      --mark:#7a5a12; --mark-ink:#fff4d6; --done:#5fae8a;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -14px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"] {
    --paper:#121417; --surface:#1a1d21; --sunk:#101215; --ink:#e8eaed; --muted:#969ca5;
    --line:#2b2f35; --accent:#ff5c72; --accent-ink:#1a0007;
    --mark:#7a5a12; --mark-ink:#fff4d6; --done:#5fae8a;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -14px rgba(0,0,0,.8);
  }

  body { background: var(--paper); color: var(--ink); font-family: var(--jp);
         font-size: 15px; line-height: 1.75; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 880px; margin: 0 auto; padding-inline: 20px; padding-block: 0 96px; }

  .top { padding-block: 40px 20px; }
  .eyebrow { margin: 0 0 10px; font-family: var(--mono); font-size: 11px; font-weight: 700;
             letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0; font-size: clamp(26px, 5vw, 34px); line-height: 1.3; text-wrap: balance; }
  .lead { margin: 14px 0 0; max-width: 40em; color: var(--muted); }
  .lead b { color: var(--ink); font-weight: 700; }

  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
         display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px;
         margin-block: 22px; padding: 11px 16px;
         background: var(--surface); border: 1px solid var(--line); border-radius: 3px;
         box-shadow: var(--shadow); }
  .bar .n { font-family: var(--mono); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
  .bar .open .n { color: var(--accent); }
  .bar span.lbl { font-size: 12px; color: var(--muted); }
  .bar .spacer { flex: 1 1 60px; }
  .warn { width: 100%; margin: 0; padding-top: 8px; border-top: 1px solid var(--line);
          font-size: 12.5px; color: var(--accent); }

  .set { margin-block: 44px 0; }
  .set > header { padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
  .set h2 { margin: 0; font-size: 19px; }
  .set .slug { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .subhead { margin: 26px 0 0; font-family: var(--mono); font-size: 11px; font-weight: 700;
             letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

  /* --- 投稿文 --- */
  .post { margin-top: 12px; background: var(--surface); border: 1px solid var(--line);
          border-radius: 3px; box-shadow: var(--shadow); overflow: hidden; }
  .post-head { display: flex; align-items: baseline; gap: 10px;
               padding: 9px 16px; background: var(--sunk); border-bottom: 1px solid var(--line); }
  .post-head .seq { font-family: var(--mono); font-weight: 700; font-size: 12.5px; }
  .post-head .w { font-family: var(--mono); font-size: 11.5px; color: var(--muted);
                  font-variant-numeric: tabular-nums; }
  .post-head .grow { flex: 1; }
  .post-head button { padding: 3px 11px; font-size: 11.5px; font-weight: 500; }
  .post-body { margin: 0; padding: 16px; white-space: pre-wrap; word-break: break-word;
               font-family: var(--jp); font-size: 15.5px; line-height: 1.85;
               cursor: text; -webkit-user-select: text; user-select: text; }
  .post-body mark { background: var(--mark); color: var(--mark-ink);
                    padding: 1px 0; border-radius: 2px; }
  .post-body mark[data-done="1"] { background: transparent; box-shadow: inset 0 -2px 0 var(--done); }
  .post-body mark sup { font-family: var(--mono); font-size: 10px; font-weight: 700;
                        color: var(--accent); padding-left: 2px; }
  .picktip { padding: 0 16px 14px; margin: 0; font-size: 12px; color: var(--muted); }

  /* --- 画像 --- */
  .proof { margin-top: 22px; }
  .proof-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .proof-head .num { font-family: var(--mono); font-weight: 700; font-size: 12px;
                     color: var(--muted); font-variant-numeric: tabular-nums; }
  .proof-head h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .proof-head .cap { color: var(--muted); font-size: 12.5px; }

  .canvas { position: relative; display: block; width: 100%; max-width: 100%;
            border: 1px solid var(--line); border-radius: 3px; background: var(--sunk);
            overflow: hidden; cursor: crosshair; box-shadow: var(--shadow); }
  .canvas img { display: block; width: 100%; height: auto; }
  .hint { position: absolute; inset: auto 0 0 0; padding: 7px 10px; font-size: 11.5px;
          color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.72));
          pointer-events: none; opacity: 0; transition: opacity .16s; }
  .canvas:hover .hint, .canvas:focus-visible .hint { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .hint { transition: none; } }

  .pin { position: absolute; transform: translate(-50%, -50%);
         width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
         background: var(--accent); color: var(--accent-ink);
         font-family: var(--mono); font-weight: 700; font-size: 12px;
         border: 0; padding: 0; cursor: pointer;
         box-shadow: 0 0 0 2px var(--surface), 0 2px 7px rgba(0,0,0,.45); }
  .pin[data-done="1"] { background: var(--done); color: #fff; }
  .pin.ghost { background: var(--ink); color: var(--paper); }

  /* --- 入力 --- */
  .composer { margin-top: 10px; padding: 12px; background: var(--surface);
              border: 1px solid var(--accent); border-radius: 3px; }
  .composer .where { margin: 0 0 8px; font-size: 12.5px; color: var(--muted); }
  .composer .where q { color: var(--ink); background: var(--mark); color: var(--mark-ink);
                       padding: 1px 4px; border-radius: 2px; }
  .composer textarea { width: 100%; box-sizing: border-box; min-height: 76px; resize: vertical;
                       padding: 9px 10px; font-family: var(--jp); font-size: 14.5px; line-height: 1.7;
                       color: var(--ink); background: var(--paper);
                       border: 1px solid var(--line); border-radius: 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  button { font-family: var(--jp); font-size: 13.5px; font-weight: 700; padding: 7px 15px;
           border-radius: 2px; border: 1px solid var(--line);
           background: var(--surface); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* --- コメント一覧 --- */
  .threads { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
  .threads:empty { display: none; }
  .threads li { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: start;
                padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); }
  .threads li + li { border-top: 0; }
  .threads li[data-done="1"] { background: transparent; }
  .threads li[data-done="1"] .body { color: var(--muted); text-decoration: line-through; }
  .tag { width: 22px; height: 22px; margin-top: 2px; border-radius: 50%; display: grid; place-items: center;
         background: var(--accent); color: var(--accent-ink);
         font-family: var(--mono); font-weight: 700; font-size: 11px; }
  li[data-done="1"] .tag { background: var(--done); color: #fff; }
  .quote { display: block; margin-bottom: 3px; font-size: 12.5px; color: var(--muted); }
  .quote b { color: var(--ink); font-weight: 500; background: var(--mark); color: var(--mark-ink);
             padding: 0 3px; border-radius: 2px; }
  .body { white-space: pre-wrap; word-break: break-word; font-size: 14px; line-height: 1.7; }
  .meta { margin-top: 3px; font-family: var(--mono); font-size: 10.5px; color: var(--muted);
          font-variant-numeric: tabular-nums; }
  .acts { display: flex; gap: 4px; }
  .acts button { padding: 3px 9px; font-size: 11.5px; font-weight: 500; }
  .empty { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); }

  @media (max-width: 460px) {
    .wrap { padding-inline: 16px; }
    .threads li { grid-template-columns: 22px 1fr; }
    .acts { grid-column: 2; }
  }
</style>

<div class="wrap">
  <header class="top">
    <p class="eyebrow">daily-hack &nbsp;/&nbsp; @heng_ji31590</p>
    <h1>X告知レビュー</h1>
    <p class="lead">
      <b>投稿文は直したいところをなぞる</b>と、そこにコメントを書けます。
      <b>画像は直したいところをクリック</b>してください。書いたものはこのページに残り、こちらから読めます。
    </p>
  </header>

  <div class="bar" id="bar">
    <span><span class="n" id="n-total">—</span> <span class="lbl">件</span></span>
    <span class="open"><span class="n" id="n-open">—</span> <span class="lbl">未対応</span></span>
    <span class="spacer"></span>
    <span class="lbl" id="conn">読み込み中…</span>
    <p class="warn" id="warn" hidden></p>
  </div>

  <main id="main"></main>
</div>

<script>
(() => {
  "use strict";

  // 画像はページに埋め込む。**相対パスで外部ファイルを読ませない**
  // （公開後に解決できず、8 枚 とも出なかった）
  const IMG = /*__IMAGES__*/{};
  // 投稿文。build.mjs が差し込む
  const POSTS = /*__POSTS__*/{};

  const SETS = [
    {
      key: "walk",
      title: "歩いてポイ活 2026年最新版",
      slug: "walk-poikatsu-2026",
      images: [
        { file: "1-summary.jpg", name: "表紙（4カード）", cap: "歩いてポイ活、勝つのはどこだ" },
        { file: "2-waon.jpg",    name: "2枚目",          cap: "毎日8,000歩で、年365円" },
        { file: "3-web3.jpg",    name: "3枚目",          cap: "STEPNは500円から1円未満へ" },
        { file: "4-mile.jpg",    name: "4枚目",          cap: "歩き続ければ、マイルは貯まる" }
      ]
    },
    {
      key: "super",
      title: "都心の格安スーパー 2026",
      slug: "tokyo-discount-supermarket-2026",
      images: [
        { file: "1-summary.jpg",     name: "表紙（4カード）", cap: "同じ「安い」でも、稼ぎ方が正反対" },
        { file: "2-trial-seiyu.jpg", name: "2枚目",          cap: "西友の建物に「TRIAL SEIYU」" },
        { file: "3-hanamasa.jpg",    name: "3枚目",          cap: "965gで、税込927円" },
        { file: "4-tv.jpg",          name: "4枚目",          cap: "くるみパン259円、カツ丼299円" }
      ]
    }
  ];

  const main = document.getElementById("main");
  const elTotal = document.getElementById("n-total");
  const elOpen = document.getElementById("n-open");
  const elConn = document.getElementById("conn");
  const elWarn = document.getElementById("warn");

  const slots = new Map();   // target -> 描画に必要なもの
  let db = null;
  let rows = [];

  function say(msg) {
    elWarn.hidden = !msg;
    elWarn.textContent = msg || "";
  }

  // **X の重みは 280。全角は 2、URL は t.co で常に 23**
  function weight(s) {
    let n = 0;
    for (const c of s.replace(/https?:\/\/\S+/g, "#".repeat(23))) {
      n += c.codePointAt(0) < 0x80 ? 1 : 2;
    }
    return n;
  }

  async function save(body) {
    if (!db) { say("保存できません。このページでコメントを保持する機能が使えていません。"); return false; }
    try {
      await db.collection("pins").add({ ...body, done: false, createdAt: new Date().toISOString() });
      say("");
      return true;
    } catch (err) {
      say("保存できませんでした（" + (err && err.code ? err.code : "不明") + "）。もう一度 試してください。");
      return false;
    }
  }

  // 共通の入力欄
  function makeComposer(onSubmit) {
    const form = document.createElement("form");
    form.className = "composer";
    form.hidden = true;
    const where = document.createElement("p");
    where.className = "where";
    const ta = document.createElement("textarea");
    ta.placeholder = "ここをこう直したい、と書いてください";
    const row = document.createElement("div");
    row.className = "row";
    const ok = document.createElement("button");
    ok.type = "submit"; ok.className = "primary"; ok.textContent = "コメントする";
    const no = document.createElement("button");
    no.type = "button"; no.textContent = "やめる";
    row.append(ok, no);
    form.append(where, ta, row);

    let ctx = null;
    const close = () => { ctx = null; form.hidden = true; ta.value = ""; render(); };
    form.open = (context, label) => {
      ctx = context;
      where.replaceChildren(...label);
      form.hidden = false;
      ta.focus();
      render();
    };
    form.close = close;
    form.ctx = () => ctx;
    no.addEventListener("click", close);
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = ta.value.trim();
      if (!text || !ctx) return;
      ok.disabled = true;
      if (await onSubmit(ctx, text)) close();
      ok.disabled = false;
    });
    return form;
  }

  // ---------- 組み立て ----------
  for (const set of SETS) {
    const sec = document.createElement("section");
    sec.className = "set";
    const head = document.createElement("header");
    const h2 = document.createElement("h2");
    h2.textContent = set.title;
    const slug = document.createElement("div");
    slug.className = "slug";
    slug.textContent = set.slug;
    head.append(h2, slug);
    sec.append(head);

    // ── 投稿文 ──
    const posts = POSTS[set.key] || [];
    if (posts.length) {
      const lbl = document.createElement("p");
      lbl.className = "subhead";
      lbl.textContent = "投稿文";
      sec.append(lbl);
    }
    posts.forEach((text, i) => {
      const target = set.key + "/text-" + (i + 1);
      const art = document.createElement("article");
      art.className = "post";

      const ph = document.createElement("div");
      ph.className = "post-head";
      const seq = document.createElement("span");
      seq.className = "seq";
      seq.textContent = "[" + (i + 1) + "/" + posts.length + "]";
      const w = document.createElement("span");
      const wt = weight(text);
      w.className = "w";
      w.textContent = "重み " + wt + " / 280（余裕 " + (280 - wt) + "）";
      const grow = document.createElement("span");
      grow.className = "grow";
      const whole = document.createElement("button");
      whole.type = "button";
      whole.textContent = "この投稿 全体にコメント";
      ph.append(seq, w, grow, whole);

      const body = document.createElement("div");
      body.className = "post-body";

      const tip = document.createElement("p");
      tip.className = "picktip";
      tip.textContent = "直したいところをなぞると、そこにコメントを置けます。";

      const composer = makeComposer((ctx, comment) =>
        save({ target, set: set.key, slug: set.slug, kind: "text",
               quote: ctx.quote, start: ctx.start, end: ctx.end, text: comment }));

      const threads = document.createElement("ul");
      threads.className = "threads";

      art.append(ph, body, tip);
      sec.append(art, composer, threads);

      slots.set(target, { kind: "text", text, body, threads, composer });

      // なぞった範囲を拾う
      body.addEventListener("mouseup", () => pick(target));
      body.addEventListener("touchend", () => setTimeout(() => pick(target), 10));
      whole.addEventListener("click", () => {
        composer.open({ quote: "", start: -1, end: -1 },
          [document.createTextNode("この投稿 全体について")]);
      });
    });

    // ── 画像 ──
    const ilbl = document.createElement("p");
    ilbl.className = "subhead";
    ilbl.textContent = "画像 4 枚";
    sec.append(ilbl);

    set.images.forEach((im, i) => {
      const target = set.key + "/" + im.file;
      const art = document.createElement("article");
      art.className = "proof";

      const ph = document.createElement("div");
      ph.className = "proof-head";
      const num = document.createElement("span");
      num.className = "num";
      num.textContent = String(i + 1).padStart(2, "0");
      const h3 = document.createElement("h3");
      h3.textContent = im.name;
      const cap = document.createElement("span");
      cap.className = "cap";
      cap.textContent = im.cap;
      ph.append(num, h3, cap);

      const canvas = document.createElement("div");
      canvas.className = "canvas";
      canvas.tabIndex = 0;
      canvas.setAttribute("role", "button");
      canvas.setAttribute("aria-label", im.name + " にコメントを置く");
      const img = document.createElement("img");
      img.src = IMG[set.slug + "/" + im.file] || "";
      img.alt = im.cap;
      img.draggable = false;
      const pins = document.createElement("div");
      const hint = document.createElement("div");
      hint.className = "hint";
      hint.textContent = "直したいところをクリック";
      canvas.append(img, pins, hint);
      // **読めなかったことを黙らせない**（1 度 それで気づけなかった）
      img.addEventListener("error", () => {
        hint.textContent = "この画像が読み込めていません";
        hint.style.opacity = "1";
      });

      const composer = makeComposer((ctx, comment) =>
        save({ target, set: set.key, slug: set.slug, kind: "image",
               file: im.file, x: ctx.x, y: ctx.y, text: comment }));

      const threads = document.createElement("ul");
      threads.className = "threads";
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "まだコメントはありません。";

      art.append(ph, canvas, composer, threads, empty);
      sec.append(art);

      slots.set(target, { kind: "image", pins, threads, empty, composer });

      const openAt = (x, y) => composer.open({ x, y },
        [document.createTextNode("位置 " + Math.round(x * 100) + "% / " + Math.round(y * 100) + "%")]);
      canvas.addEventListener("click", (e) => {
        if (e.target.closest(".pin")) return;
        const r = canvas.getBoundingClientRect();
        openAt(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
               Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)));
      });
      canvas.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openAt(0.5, 0.5); }
      });
    });

    main.append(sec);
  }

  // ---------- なぞった範囲 → 文字位置 ----------
  function offsetOf(root, node, off) {
    let n = 0;
    const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let t;
    while ((t = walk.nextNode())) {
      if (t === node) return n + off;
      n += t.nodeValue.length;
    }
    return -1;
  }

  function pick(target) {
    const slot = slots.get(target);
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return;
    const r = sel.getRangeAt(0);
    if (!slot.body.contains(r.startContainer) || !slot.body.contains(r.endContainer)) return;
    let a = offsetOf(slot.body, r.startContainer, r.startOffset);
    let b = offsetOf(slot.body, r.endContainer, r.endOffset);
    if (a < 0 || b < 0) return;
    if (a > b) { const t = a; a = b; b = t; }
    const quote = slot.text.slice(a, b).trim();
    if (!quote) return;
    const q = document.createElement("q");
    q.textContent = quote.length > 40 ? quote.slice(0, 40) + "…" : quote;
    slot.composer.open({ quote, start: a, end: b },
      [document.createTextNode("なぞったところ： "), q]);
  }

  // ---------- 描画 ----------
  function forTarget(t) { return rows.filter((r) => r.target === t); }

  function renderText(target) {
    const slot = slots.get(target);
    const mine = forTarget(target).filter((r) => r.start >= 0)
      .slice().sort((a, b) => a.start - b.start);
    const all = forTarget(target);
    const frag = document.createDocumentFragment();
    let cur = 0;
    for (const r of mine) {
      if (r.start < cur || r.end > slot.text.length) continue;   // 重なりは先勝ち
      frag.append(document.createTextNode(slot.text.slice(cur, r.start)));
      const m = document.createElement("mark");
      m.dataset.done = r.done ? "1" : "0";
      m.append(document.createTextNode(slot.text.slice(r.start, r.end)));
      const sup = document.createElement("sup");
      sup.textContent = String(all.indexOf(r) + 1);
      m.append(sup);
      frag.append(m);
      cur = r.end;
    }
    frag.append(document.createTextNode(slot.text.slice(cur)));
    slot.body.replaceChildren(frag);
    renderThreads(target);
  }

  function renderPins(target) {
    const slot = slots.get(target);
    const mine = forTarget(target);
    slot.pins.replaceChildren();
    mine.forEach((r, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "pin";
      b.dataset.done = r.done ? "1" : "0";
      b.style.left = (r.x * 100) + "%";
      b.style.top = (r.y * 100) + "%";
      b.textContent = String(i + 1);
      b.title = r.text;
      slot.pins.append(b);
    });
    const c = slot.composer.ctx();
    if (c && typeof c.x === "number") {
      const g = document.createElement("span");
      g.className = "pin ghost";
      g.style.left = (c.x * 100) + "%";
      g.style.top = (c.y * 100) + "%";
      g.textContent = "+";
      slot.pins.append(g);
    }
    slot.empty.hidden = mine.length > 0;
    renderThreads(target);
  }

  function renderThreads(target) {
    const slot = slots.get(target);
    const mine = forTarget(target);
    slot.threads.replaceChildren();
    mine.forEach((r, i) => {
      const li = document.createElement("li");
      li.dataset.done = r.done ? "1" : "0";

      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = String(i + 1);

      const col = document.createElement("div");
      if (r.quote) {
        const q = document.createElement("span");
        q.className = "quote";
        const b = document.createElement("b");
        b.textContent = r.quote.length > 48 ? r.quote.slice(0, 48) + "…" : r.quote;
        q.append(b);
        col.append(q);
      }
      const body = document.createElement("div");
      body.className = "body";
      body.textContent = r.text;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = fmt(r.createdAt) + (r.done ? " ・ 対応済み" : "");
      col.append(body, meta);

      const acts = document.createElement("div");
      acts.className = "acts";
      const bDone = document.createElement("button");
      bDone.type = "button";
      bDone.textContent = r.done ? "戻す" : "対応済み";
      bDone.addEventListener("click", async () => {
        if (!db) return;
        bDone.disabled = true;
        try { await db.doc("pins/" + r.id).update({ done: !r.done }); }
        catch (e) { say("更新できませんでした。"); }
        finally { bDone.disabled = false; }
      });
      const bDel = document.createElement("button");
      bDel.type = "button";
      bDel.textContent = "削除";
      bDel.addEventListener("click", async () => {
        if (!db) return;
        bDel.disabled = true;
        try { await db.doc("pins/" + r.id).delete(); }
        catch (e) { say("削除できませんでした。"); bDel.disabled = false; }
      });
      acts.append(bDone, bDel);

      li.append(tag, col, acts);
      slot.threads.append(li);
    });
  }

  function fmt(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return "";
    const p = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate())
      + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function render() {
    for (const [target, slot] of slots) {
      if (slot.kind === "text") renderText(target); else renderPins(target);
    }
    elTotal.textContent = rows.length;
    elOpen.textContent = rows.filter((r) => !r.done).length;
  }

  render();

  // ---------- 保存先 ----------
  (async () => {
    let cap = null;
    try { cap = await window.claude?.use?.("db"); } catch (e) { cap = null; }
    if (!cap) {
      elConn.textContent = "保存できません";
      say("このページではコメントを保持できません。公開されたリンクから開いてください。");
      return;
    }
    db = cap;
    elConn.textContent = "コメントは自動で保存されます";
    db.collection("pins").orderBy("createdAt").onSnapshot(
      (snap) => {
        rows = snap.docs.map((d) => {
          const v = d.data() || {};
          return {
            id: d.id,
            target: String(v.target || ""),
            x: typeof v.x === "number" ? v.x : 0.5,
            y: typeof v.y === "number" ? v.y : 0.5,
            quote: typeof v.quote === "string" ? v.quote : "",
            start: typeof v.start === "number" ? v.start : -1,
            end: typeof v.end === "number" ? v.end : -1,
            text: String(v.text || ""),
            done: v.done === true,
            createdAt: String(v.createdAt || "")
          };
        });
        render();
      },
      (err) => {
        elConn.textContent = "接続が切れました";
        say("コメントの読み込みが止まりました（" + err.code + "）。ページを開き直してください。");
      }
    );
  })();
})();
</script>
