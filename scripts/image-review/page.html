<title>X告知画像レビュー</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root {
    --paper:   #eef0f3;
    --surface: #ffffff;
    --sunk:    #e4e7ec;
    --ink:     #15181c;
    --muted:   #646b74;
    --line:    #d3d8df;
    --accent:  #cf2740;
    --accent-ink: #ffffff;
    --done:    #3c7a5e;
    --shadow:  0 1px 2px rgba(20,24,30,.06), 0 8px 24px -14px rgba(20,24,30,.35);

    --jp: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:   #121417;
      --surface: #1a1d21;
      --sunk:    #101215;
      --ink:     #e8eaed;
      --muted:   #969ca5;
      --line:    #2b2f35;
      --accent:  #ff5c72;
      --accent-ink: #1a0007;
      --done:    #5fae8a;
      --shadow:  0 1px 2px rgba(0,0,0,.5), 0 8px 24px -14px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"] {
    --paper:   #121417;
    --surface: #1a1d21;
    --sunk:    #101215;
    --ink:     #e8eaed;
    --muted:   #969ca5;
    --line:    #2b2f35;
    --accent:  #ff5c72;
    --accent-ink: #1a0007;
    --done:    #5fae8a;
    --shadow:  0 1px 2px rgba(0,0,0,.5), 0 8px 24px -14px rgba(0,0,0,.8);
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--jp);
    font-size: 15px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding-inline: 20px; padding-block: 0 96px; }

  /* --- 見出し --- */
  .top { padding-block: 40px 20px; }
  .eyebrow {
    margin: 0 0 10px; font-family: var(--mono); font-size: 11px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  }
  h1 { margin: 0; font-size: clamp(26px, 5vw, 34px); line-height: 1.3; letter-spacing: .01em; text-wrap: balance; }
  .lead { margin: 14px 0 0; max-width: 40em; color: var(--muted); }
  .lead b { color: var(--ink); font-weight: 700; }

  /* --- 進捗バー --- */
  .bar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px;
    margin-block: 22px; padding: 11px 16px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 3px;
    box-shadow: var(--shadow);
  }
  .bar .n { font-family: var(--mono); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
  .bar .open .n { color: var(--accent); }
  .bar span.lbl { font-size: 12px; color: var(--muted); }
  .bar .spacer { flex: 1 1 60px; }
  .warn {
    width: 100%; margin: 0; padding-top: 8px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--accent);
  }

  /* --- セット --- */
  .set { margin-block: 40px 0; }
  .set > header { padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
  .set h2 { margin: 0; font-size: 19px; letter-spacing: .01em; }
  .set .slug { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }

  /* --- 1枚ぶん --- */
  .proof { margin-top: 26px; }
  .proof-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .proof-head .num {
    font-family: var(--mono); font-weight: 700; font-size: 12px;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .proof-head h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .proof-head .cap { color: var(--muted); font-size: 12.5px; }

  .canvas {
    position: relative; display: block; width: 100%; max-width: 100%;
    padding: 0; border: 1px solid var(--line); border-radius: 3px;
    background: var(--sunk); overflow: hidden; cursor: crosshair;
    box-shadow: var(--shadow);
  }
  .canvas img { display: block; width: 100%; height: auto; }
  .hint {
    position: absolute; inset: auto 0 0 0; padding: 7px 10px;
    font-size: 11.5px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.72));
    pointer-events: none; opacity: 0; transition: opacity .16s;
  }
  .canvas:hover .hint, .canvas:focus-visible .hint { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .hint { transition: none; } }

  .pin {
    position: absolute; transform: translate(-50%, -50%);
    width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--accent); color: var(--accent-ink);
    font-family: var(--mono); font-weight: 700; font-size: 12px;
    border: 0; padding: 0; cursor: pointer;
    box-shadow: 0 0 0 2px var(--surface), 0 2px 7px rgba(0,0,0,.45);
  }
  .pin[data-done="1"] { background: var(--done); color: #fff; }
  .pin.ghost { background: var(--ink); color: var(--paper); }
  .pin.lit { outline: 3px solid var(--accent); outline-offset: 3px; }

  /* --- 入力 --- */
  .composer { margin-top: 10px; padding: 12px; background: var(--surface); border: 1px solid var(--accent); border-radius: 3px; }
  .composer p { margin: 0 0 8px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .composer textarea {
    width: 100%; box-sizing: border-box; min-height: 76px; resize: vertical;
    padding: 9px 10px; font-family: var(--jp); font-size: 14.5px; line-height: 1.7;
    color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 2px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  button {
    font-family: var(--jp); font-size: 13.5px; font-weight: 700;
    padding: 7px 15px; border-radius: 2px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* --- コメント一覧 --- */
  .threads { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
  .threads:empty { display: none; }
  .threads li {
    display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: start;
    padding: 10px 12px; background: var(--surface); border: 1px solid var(--line);
  }
  .threads li + li { border-top: 0; }
  .threads li[data-done="1"] { background: transparent; }
  .threads li[data-done="1"] .body { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
  .tag {
    width: 22px; height: 22px; margin-top: 2px; border-radius: 50%;
    display: grid; place-items: center; background: var(--accent); color: var(--accent-ink);
    font-family: var(--mono); font-weight: 700; font-size: 11px;
  }
  li[data-done="1"] .tag { background: var(--done); color: #fff; }
  .body { white-space: pre-wrap; word-break: break-word; font-size: 14px; line-height: 1.7; }
  .meta { margin-top: 3px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .acts { display: flex; gap: 4px; }
  .acts button { padding: 3px 9px; font-size: 11.5px; font-weight: 500; }

  .empty { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); }

  @media (max-width: 460px) {
    .wrap { padding-inline: 16px; }
    .threads li { grid-template-columns: 22px 1fr; }
    .acts { grid-column: 2; }
  }
</style>

<div class="wrap">
  <header class="top">
    <p class="eyebrow">daily-hack &nbsp;/&nbsp; @heng_ji31590</p>
    <h1>X告知画像レビュー</h1>
    <p class="lead">
      画像の<b>直したいところをクリック</b>すると、そこにピンが立ってコメントを書けます。
      書いたものはこのページに残り、こちらから読めます。チャットに書き戻す必要はありません。
    </p>
  </header>

  <div class="bar" id="bar">
    <span><span class="n" id="n-total">—</span> <span class="lbl">件</span></span>
    <span class="open"><span class="n" id="n-open">—</span> <span class="lbl">未対応</span></span>
    <span class="spacer"></span>
    <span class="lbl" id="conn">読み込み中…</span>
    <p class="warn" id="warn" hidden></p>
  </div>

  <main id="main"></main>
</div>

<script>
(() => {
  "use strict";

  // 画像はページに埋め込む。**相対パスで外部ファイルを読ませない**
  // （公開後に解決できず、8 枚 とも出なかった）
  const IMG = /*__IMAGES__*/{};

  const SETS = [
    {
      key: "walk",
      title: "歩いてポイ活 2026年最新版",
      slug: "walk-poikatsu-2026",
      images: [
        { file: "1-summary.jpg", name: "表紙（4カード）", cap: "歩いてポイ活、勝つのはWAON" },
        { file: "2-waon.jpg",    name: "2枚目",          cap: "毎日8,000歩で、年365円" },
        { file: "3-bitwalk.jpg", name: "3枚目",          cap: "1日12,500歩で、約7.5円" },
        { file: "4-jal.jpg",     name: "4枚目",          cap: "歩くのに、月550円" }
      ]
    },
    {
      key: "super",
      title: "都心の格安スーパー 2026",
      slug: "tokyo-discount-supermarket-2026",
      images: [
        { file: "1-summary.jpg",    name: "表紙（4カード）", cap: "同じ「安い」でも、稼ぎ方が正反対" },
        { file: "2-trial-seiyu.jpg", name: "2枚目",          cap: "西友の建物に「TRIAL SEIYU」" },
        { file: "3-hanamasa.jpg",   name: "3枚目",          cap: "965gで、税込927円" },
        { file: "4-tv.jpg",         name: "4枚目",          cap: "くるみパン259円、カツ丼299円" }
      ]
    }
  ];

  const main = document.getElementById("main");
  const elTotal = document.getElementById("n-total");
  const elOpen = document.getElementById("n-open");
  const elConn = document.getElementById("conn");
  const elWarn = document.getElementById("warn");

  /** target key -> {pins, threads, count} */
  const slots = new Map();
  let db = null;
  let rows = [];

  const targetKey = (setKey, file) => setKey + "/" + file;

  function say(msg) {
    if (!msg) { elWarn.hidden = true; elWarn.textContent = ""; return; }
    elWarn.hidden = false;
    elWarn.textContent = msg;
  }

  // ---------- 組み立て ----------
  for (const set of SETS) {
    const sec = document.createElement("section");
    sec.className = "set";
    const head = document.createElement("header");
    const h2 = document.createElement("h2");
    h2.textContent = set.title;
    const slug = document.createElement("div");
    slug.className = "slug";
    slug.textContent = set.slug;
    head.append(h2, slug);
    sec.append(head);

    set.images.forEach((im, i) => {
      const key = targetKey(set.key, im.file);
      const art = document.createElement("article");
      art.className = "proof";

      const ph = document.createElement("div");
      ph.className = "proof-head";
      const num = document.createElement("span");
      num.className = "num";
      num.textContent = String(i + 1).padStart(2, "0");
      const h3 = document.createElement("h3");
      h3.textContent = im.name;
      const cap = document.createElement("span");
      cap.className = "cap";
      cap.textContent = im.cap;
      ph.append(num, h3, cap);

      const canvas = document.createElement("div");
      canvas.className = "canvas";
      canvas.tabIndex = 0;
      canvas.setAttribute("role", "button");
      canvas.setAttribute("aria-label", im.name + " にコメントを置く");
      const img = document.createElement("img");
      img.src = IMG[set.slug + "/" + im.file] || "";
      img.alt = im.cap;
      img.draggable = false;
      const pins = document.createElement("div");
      const hint = document.createElement("div");
      hint.className = "hint";
      hint.textContent = "直したいところをクリック";
      canvas.append(img, pins, hint);
      // **読めなかったことを黙らせない**（1 度 それで気づけなかった）
      img.addEventListener("error", () => {
        hint.textContent = "この画像が読み込めていません";
        hint.style.opacity = "1";
      });

      const composer = document.createElement("form");
      composer.className = "composer";
      composer.hidden = true;
      const coord = document.createElement("p");
      const ta = document.createElement("textarea");
      ta.id = "ta-" + key.replace(/[^a-z0-9]/gi, "-");
      ta.placeholder = "ここをこう直したい、と書いてください";
      const row = document.createElement("div");
      row.className = "row";
      const save = document.createElement("button");
      save.type = "submit";
      save.className = "primary";
      save.textContent = "コメントを置く";
      const cancel = document.createElement("button");
      cancel.type = "button";
      cancel.textContent = "やめる";
      row.append(save, cancel);
      composer.append(coord, ta, row);

      const threads = document.createElement("ul");
      threads.className = "threads";

      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "まだコメントはありません。";

      art.append(ph, canvas, composer, threads, empty);
      sec.append(art);

      slots.set(key, { pins, threads, empty, canvas });

      // --- クリックでピンを置く ---
      let draft = null;
      const openComposer = (x, y) => {
        draft = { x, y };
        coord.textContent = "位置 " + Math.round(x * 100) + "% / " + Math.round(y * 100) + "%";
        composer.hidden = false;
        renderPins(key);
        ta.focus();
      };
      const closeComposer = () => {
        draft = null;
        composer.hidden = true;
        ta.value = "";
        renderPins(key);
      };
      canvas.addEventListener("click", (e) => {
        if (e.target.closest(".pin")) return;
        const r = canvas.getBoundingClientRect();
        openComposer(
          Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
          Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))
        );
      });
      canvas.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openComposer(0.5, 0.5); }
      });
      cancel.addEventListener("click", closeComposer);
      composer.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = ta.value.trim();
        if (!text || !draft) return;
        if (!db) { say("保存できません。このページでコメントを保持する機能が使えていません。"); return; }
        save.disabled = true;
        try {
          await db.collection("pins").add({
            target: key, set: set.key, slug: set.slug, file: im.file,
            x: draft.x, y: draft.y, text, done: false,
            createdAt: new Date().toISOString()
          });
          closeComposer();
          say("");
        } catch (err) {
          say("保存できませんでした（" + (err && err.code ? err.code : "不明") + "）。もう一度 試してください。");
        } finally {
          save.disabled = false;
        }
      });

      slots.get(key).draftOf = () => draft;
    });

    main.append(sec);
  }

  // ---------- 描画 ----------
  function renderPins(key) {
    const slot = slots.get(key);
    if (!slot) return;
    const mine = rows.filter((r) => r.target === key);
    slot.pins.replaceChildren();
    mine.forEach((r, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "pin";
      b.dataset.done = r.done ? "1" : "0";
      b.style.left = (r.x * 100) + "%";
      b.style.top = (r.y * 100) + "%";
      b.textContent = String(i + 1);
      b.title = r.text;
      b.addEventListener("click", (e) => {
        e.stopPropagation();
        const li = slot.threads.querySelector('[data-id="' + r.id + '"]');
        if (!li) return;
        li.scrollIntoView({ block: "center", behavior: "smooth" });
        li.querySelector(".tag").classList.add("lit");
        setTimeout(() => li.querySelector(".tag").classList.remove("lit"), 1200);
      });
      slot.pins.append(b);
    });
    const d = slot.draftOf && slot.draftOf();
    if (d) {
      const g = document.createElement("span");
      g.className = "pin ghost";
      g.style.left = (d.x * 100) + "%";
      g.style.top = (d.y * 100) + "%";
      g.textContent = "+";
      slot.pins.append(g);
    }
  }

  function renderThreads(key) {
    const slot = slots.get(key);
    const mine = rows.filter((r) => r.target === key);
    slot.threads.replaceChildren();
    slot.empty.hidden = mine.length > 0;
    mine.forEach((r, i) => {
      const li = document.createElement("li");
      li.dataset.id = r.id;
      li.dataset.done = r.done ? "1" : "0";

      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = String(i + 1);

      const col = document.createElement("div");
      const body = document.createElement("div");
      body.className = "body";
      body.textContent = r.text;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = fmt(r.createdAt) + (r.done ? " ・ 対応済み" : "");
      col.append(body, meta);

      const acts = document.createElement("div");
      acts.className = "acts";
      const bDone = document.createElement("button");
      bDone.type = "button";
      bDone.textContent = r.done ? "戻す" : "対応済み";
      bDone.addEventListener("click", async () => {
        if (!db) return;
        bDone.disabled = true;
        try { await db.doc("pins/" + r.id).update({ done: !r.done }); }
        catch (e) { say("更新できませんでした。"); }
        finally { bDone.disabled = false; }
      });
      const bDel = document.createElement("button");
      bDel.type = "button";
      bDel.textContent = "削除";
      bDel.addEventListener("click", async () => {
        if (!db) return;
        bDel.disabled = true;
        try { await db.doc("pins/" + r.id).delete(); }
        catch (e) { say("削除できませんでした。"); bDel.disabled = false; }
      });
      acts.append(bDone, bDel);

      li.append(tag, col, acts);
      slot.threads.append(li);
    });
  }

  function fmt(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return "";
    const p = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function renderAll() {
    for (const key of slots.keys()) { renderPins(key); renderThreads(key); }
    elTotal.textContent = rows.length;
    elOpen.textContent = rows.filter((r) => !r.done).length;
  }

  renderAll();

  // ---------- 保存先 ----------
  (async () => {
    let cap = null;
    try { cap = await window.claude?.use?.("db"); } catch (e) { cap = null; }
    if (!cap) {
      elConn.textContent = "保存できません";
      say("このページではコメントを保持できません。プレビューで開いている場合は、公開されたリンクから開いてください。");
      return;
    }
    db = cap;
    elConn.textContent = "コメントは自動で保存されます";
    db.collection("pins").orderBy("createdAt").onSnapshot(
      (snap) => {
        rows = snap.docs.map((d) => {
          const v = d.data() || {};
          return {
            id: d.id,
            target: String(v.target || ""),
            x: typeof v.x === "number" ? v.x : 0.5,
            y: typeof v.y === "number" ? v.y : 0.5,
            text: String(v.text || ""),
            done: v.done === true,
            createdAt: String(v.createdAt || "")
          };
        });
        renderAll();
      },
      (err) => {
        elConn.textContent = "接続が切れました";
        say("コメントの読み込みが止まりました（" + err.code + "）。ページを開き直してください。");
      }
    );
  })();
})();
</script>
