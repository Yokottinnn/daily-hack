<!-- フォロワー 300 人のお礼画像（2026-10-03・3 版目）の元。gen-x-cards.mjs の cover/photo に当てはまらないので HTML で組んだ。
     作り直すとき: この HTML と ZenMaru-{500,700,900}.woff2 / ZenMaru-latin-900.woff2（@fontsource/zen-maru-gothic）と public/images/expr-04-cheer.png を同じ階層に置き、
     playwright で 1080x1080 を jpeg 92 で撮る → public/images/follower-300/x/1-card.jpg。素材はキャラと自作の図だけなので出所の行は要らない。
     3 版目の構図: 利用者が指定した参考 4 本（x205）に共通する「キャラを片側に大きく・反対側に 数字 → 突破 → 普段の発信内容」。配色は x204 の調和の取れたもの（淡いピンク・白縁・黒線なし） -->
<!doctype html><html lang="ja"><head><meta charset="utf-8">
<style>
@font-face{font-family:Z;src:url(ZenMaru-500.woff2);font-weight:500}
@font-face{font-family:Z;src:url(ZenMaru-700.woff2);font-weight:700}
@font-face{font-family:Z;src:url(ZenMaru-900.woff2);font-weight:900}
@font-face{font-family:Z;src:url(ZenMaru-latin-900.woff2);font-weight:900;unicode-range:U+0000-00FF}
:root{--p50:#FFF5F8;--p100:#FDE4EE;--p200:#F8C9D9;--p300:#F09DBB;--p500:#EC5C90;--p600:#D63E76;--p700:#A82959;--c100:#FFF1C8;--y:#F5C518;--ink:#2A1923;--ink2:#5A4651}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px}
body{font-family:Z,sans-serif;color:var(--ink);overflow:hidden;position:relative;
 background:
  radial-gradient(520px 380px at 50% 30%,rgba(255,241,200,.9),transparent 70%),
  radial-gradient(420px 420px at 90% 95%,rgba(248,201,217,.7),transparent 70%),
  linear-gradient(170deg,#FFF8FA 0%,#FDE4EE 100%)}
.deco{position:absolute;pointer-events:none}
.bokeh{border-radius:50%;filter:blur(2px)}
.top{position:absolute;top:58px;left:545px;right:30px;display:flex;justify-content:center;align-items:center;gap:14px;color:var(--p600);font-weight:900;font-size:22px;letter-spacing:.3em}
.top i{display:block;width:44px;height:2px;background:var(--p300);border-radius:2px}
.col{position:absolute;left:545px;right:30px;text-align:center}
.lead{top:104px;font-weight:900;font-size:78px;color:var(--p600);letter-spacing:.04em;-webkit-text-stroke:12px #fff;paint-order:stroke fill;filter:drop-shadow(0 6px 10px rgba(214,62,118,.18))}
.num{top:178px;height:240px;font-weight:900;line-height:240px;white-space:nowrap}
.num span{position:absolute;left:0;right:0}
.num .bk{color:#fff;-webkit-text-stroke:26px #fff;filter:drop-shadow(0 12px 16px rgba(214,62,118,.28))}
.num .fr{background:linear-gradient(180deg,#F58AB0 0%,#EC5C90 45%,#D63E76 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.num b{font-size:232px;letter-spacing:-.01em;font-weight:900}
.num em{font-style:normal;font-size:96px;font-weight:900;margin-left:4px}
.ribbon{position:absolute;top:438px;left:calc(545px + (505px - 380px)/2);width:380px;height:86px}
.ribbon .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:52px;letter-spacing:.14em;top:-9px}
.mascot{position:absolute;left:-74px;bottom:-24px;width:650px;
 -webkit-mask-image:linear-gradient(to bottom,#000 82%,transparent 99%)}
.bubble{position:absolute;left:36px;top:64px;width:470px;height:250px}
.bubble .tx{position:absolute;left:24px;right:24px;top:34px;text-align:center}
.bubble .a{font-weight:900;font-size:52px;color:var(--p600);letter-spacing:.04em;line-height:1.2}
.bubble .b{font-weight:700;font-size:36px;color:var(--ink);line-height:1.4;margin-top:8px}
.bubble .c{font-weight:500;font-size:23px;color:var(--ink2);margin-top:8px}
.sum{top:580px;bottom:44px;background:rgba(255,255,255,.72);border-radius:34px;box-shadow:0 18px 36px -20px rgba(214,62,118,.35);padding:30px 34px 20px;text-align:left}
.sum .h{display:flex;align-items:center;gap:12px;justify-content:center;color:var(--p600);font-weight:900;font-size:27px;letter-spacing:.04em;margin-bottom:18px}
.sum .h i{flex:1;height:2px;background:var(--p200);border-radius:2px}
.sum ul{list-style:none}
.sum li{display:flex;align-items:center;gap:16px;font-weight:700;font-size:33px;color:var(--ink);height:88px;border-bottom:2px dotted var(--p200)}
.sum li:last-child{border-bottom:none}
.sum li span{display:flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:50%;background:var(--p100);font-size:30px;flex:none}
.sum li em{font-style:normal;color:var(--p600)}
</style></head><body>
<svg class="deco" width="1080" height="1080" style="left:0;top:0" id="bg"></svg>
<div class="top"><i></i>DAILY HACK<i></i></div>
<img class="mascot" src="expr-04-cheer.png">
<div class="bubble">
 <svg width="470" height="250" viewBox="0 0 470 250" style="overflow:visible;filter:drop-shadow(0 14px 22px rgba(214,62,118,.22))">
  <path d="M40 6 H430 Q464 6 464 40 V176 Q464 210 430 210 H300 Q286 232 262 262 Q262 232 248 210 H40 Q6 210 6 176 V40 Q6 6 40 6 Z" fill="#fff"/>
 </svg>
 <div class="tx">
  <div class="a">…ありがと。<svg width="34" height="30" viewBox="0 0 24 22" style="vertical-align:middle;margin-left:4px"><path d="M0 6 C0 -2 10 -4 12 3 C14 -4 24 -2 24 6 C24 14 12 20 12 22 C12 20 0 14 0 6 Z" fill="#F09DBB"/></svg></div>
  <div class="b">一回しか言わないから。</div>
  <div class="c">別にあんたのためじゃないけど</div>
 </div>
</div>
<div class="col lead">フォロワー</div>
<div class="col num">
 <span class="bk"><b>300</b><em>人</em></span>
 <span class="fr"><b>300</b><em>人</em></span>
</div>
<div class="ribbon">
 <svg width="380" height="86" viewBox="0 0 380 86">
  <path d="M0 22 L40 22 L40 80 L0 80 L19 51 Z" fill="#D63E76"/>
  <path d="M380 22 L340 22 L340 80 L380 80 L361 51 Z" fill="#D63E76"/>
  <path d="M40 80 L58 70 L58 80 Z M340 80 L322 70 L322 80 Z" fill="#A82959"/>
  <rect x="30" y="6" width="320" height="64" rx="14" fill="#EC5C90"/>
  <rect x="30" y="6" width="320" height="28" rx="14" fill="#fff" opacity=".14"/>
 </svg>
 <div class="t">突破！</div>
</div>
<div class="col sum">
 <div class="h"><i></i>アタシが毎日 指摘してること<i></i></div>
 <ul>
  <li><span>💰</span><p>ポイ活・<em>節約</em></p></li>
  <li><span>💳</span><p><em>クレカ</em>比較</p></li>
  <li><span>🍚</span><p>コスパ最強<em>グルメ</em></p></li>
  <li><span>🎡</span><p>お得な<em>お出かけ</em></p></li>
 </ul>
</div>
<script>
const s=document.getElementById('bg');let k=11;const r=()=>{k=(k*9301+49297)%233280;return k/233280};
const ns='http://www.w3.org/2000/svg';
const add=(t,a)=>{const e=document.createElementNS(ns,t);for(const x in a)e.setAttribute(x,a[x]);s.appendChild(e);return e};
// やわらかい玉ボケ（文字の帯は避ける）
for(let i=0;i<22;i++){const x=r()*1080,y=r()*1080,R=8+r()*22;if(x>520)continue;if(y<330)continue;if(x>40&&y>440)continue;
 add('circle',{cx:x,cy:y,r:R,fill:['#FFFFFF','#F8C9D9','#FFF1C8'][i%3],opacity:.55+r()*.3});}
// ハート
const heart=(x,y,z,c,o)=>add('path',{d:'M0 6 C0 -2 10 -4 12 3 C14 -4 24 -2 24 6 C24 14 12 20 12 22 C12 20 0 14 0 6 Z',fill:c,opacity:o,transform:`translate(${x},${y}) scale(${z}) rotate(${-15+r()*30} 12 10)`});
[[1012,150,1.6],[1036,566,1.2],[470,400,1.9],[40,360,1.6],[520,40,1.1],[30,30,1.2]].forEach(([x,y,z],i)=>heart(x,y,z,i%2?'#F09DBB':'#EC5C90',.75));
// きらきら
const star=(x,y,z,c)=>add('path',{d:'M0 -12 Q2 -2 12 0 Q2 2 0 12 Q-2 2 -12 0 Q-2 -2 0 -12 Z',fill:c,transform:`translate(${x},${y}) scale(${z})`});
[[1040,90,1.4],[570,150,1.2],[1040,300,1.1],[560,500,1.3],[1030,520,1.1],[440,470,1.2],[100,420,1],[510,20,1]].forEach(([x,y,z],i)=>star(x,y,z,i%2?'#F5C518':'#FFFFFF'));
</script>
</body></html>
