<!-- 青バッジ報告（2026-10-12・2 版目）。follower-300-grok/layer-ui.html を下敷きに、右下「アタシが毎日 指摘してること」・吹き出し・ハート・きらきらはそのまま流用。
     左上にブログ紹介、右に青バッジ＋「付けたわよ！」。layer=bg / ui / full は gen で末尾に CSS を足して切り替える -->
<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="zm/500.css"><link rel="stylesheet" href="zm/700.css"><link rel="stylesheet" href="zm/900.css">
<style>
:root{--p50:#FFF5F8;--p100:#FDE4EE;--p200:#F8C9D9;--p300:#F09DBB;--p500:#EC5C90;--p600:#D63E76;--p700:#A82959;--c100:#FFF1C8;--y:#F5C518;--ink:#2A1923;--ink2:#5A4651}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px}
body{font-family:"Zen Maru Gothic",sans-serif;color:var(--ink);overflow:hidden;position:relative;
 background:
  radial-gradient(420px 380px at 78% 26%,rgba(207,232,255,.95),transparent 70%),
  radial-gradient(520px 380px at 30% 22%,rgba(255,241,200,.8),transparent 70%),
  radial-gradient(420px 420px at 90% 95%,rgba(248,201,217,.7),transparent 70%),
  linear-gradient(170deg,#FFF8FA 0%,#FDE4EE 100%)}
.deco{position:absolute;pointer-events:none}
.bokeh{border-radius:50%;filter:blur(2px)}
.blog{position:absolute;left:36px;top:40px;width:480px;padding:22px 26px 20px;background:rgba(255,255,255,.82);border-radius:30px;box-shadow:0 16px 30px -18px rgba(214,62,118,.35)}
.blog .k{font-weight:700;font-size:20px;color:var(--ink2);letter-spacing:.08em}
.blog .n{display:flex;align-items:center;gap:12px;margin-top:4px;font-weight:900;font-size:58px;color:var(--p600);letter-spacing:.02em;line-height:1.1}
.blog .n img{width:60px;height:60px;border-radius:50%;border:3px solid var(--p200);object-fit:cover}
.blog .t{margin-top:6px;font-weight:900;font-size:27px;color:var(--ink)}

.col{position:absolute;left:545px;right:30px;text-align:center}
.lead{top:40px;font-weight:900;font-size:78px;color:#0C6FC0;letter-spacing:.04em;-webkit-text-stroke:12px #fff;paint-order:stroke fill;filter:drop-shadow(0 6px 10px rgba(12,111,192,.2))}
.num{top:146px;height:290px}
.num svg{width:290px;height:290px;overflow:visible;filter:drop-shadow(0 18px 26px rgba(12,111,192,.38))}
.shine{animation:sweep 3s ease-in-out infinite}
@keyframes sweep{0%,30%{transform:translateX(-90px) rotate(20deg)}60%,100%{transform:translateX(90px) rotate(20deg)}}
.ribbon{position:absolute;top:450px;left:545px;right:30px;display:flex;justify-content:center}
.ribbon .t{display:inline-block;padding:12px 46px 16px;border-radius:999px;background:linear-gradient(180deg,#3BA4F5,#0C6FC0);border:5px solid #fff;box-shadow:0 14px 24px -10px rgba(12,111,192,.55);color:#fff;font-weight:900;font-size:50px;letter-spacing:.1em;white-space:nowrap}
.mascot{position:absolute;left:-74px;bottom:-24px;width:650px;
 -webkit-mask-image:linear-gradient(to bottom,#000 82%,transparent 99%)}
.bubble{position:absolute;left:40px;top:228px;width:470px;height:250px;transform-origin:52% 100%}
.bubble .tx{position:absolute;left:24px;right:24px;top:34px;text-align:center}
.bubble .a{white-space:nowrap;font-weight:900;font-size:48px;color:#0C6FC0;letter-spacing:.04em;line-height:1.2}
.bubble .b{white-space:nowrap;font-weight:700;font-size:28px;color:var(--ink);line-height:1.4;margin-top:8px}
.bubble .c{font-weight:500;font-size:23px;color:var(--ink2);margin-top:8px}
.sum{top:580px;bottom:44px;background:rgba(255,255,255,.72);border-radius:34px;box-shadow:0 18px 36px -20px rgba(214,62,118,.35);padding:30px 34px 20px;text-align:left}
.sum .h{display:flex;align-items:center;gap:12px;justify-content:center;color:var(--p600);font-weight:900;font-size:27px;letter-spacing:.04em;margin-bottom:18px}
.sum .h i{flex:1;height:2px;background:var(--p200);border-radius:2px}
.sum ul{list-style:none}
.sum li{display:flex;align-items:center;gap:16px;font-weight:700;font-size:33px;color:var(--ink);height:88px;border-bottom:2px dotted var(--p200)}
.sum li:last-child{border-bottom:none}
.sum li span{display:flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:50%;background:var(--p100);font-size:30px;flex:none}
.sum li em{font-style:normal;color:var(--p600)}

/* 動き（1 周 3 秒・GIF 用）。currentTime で 1 コマずつ止めて撮る */
@keyframes tw{0%,100%{transform:scale(.3) rotate(0);opacity:.2}50%{transform:scale(1.6) rotate(45deg);opacity:1}}
@keyframes fl{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-34px) scale(1.25)}}
@keyframes bubble{0%{transform:scale(.6);opacity:0}8%{transform:scale(1.12);opacity:1}14%{transform:scale(.96)}20%,100%{transform:scale(1)}}
@keyframes bobb{0%,100%{translate:0 0}50%{translate:0 -10px}}
@keyframes pop{0%{transform:scale(.7)}10%{transform:scale(1.22) rotate(-3deg)}18%{transform:scale(.94) rotate(2deg)}26%{transform:scale(1.06) rotate(0)}34%,100%{transform:scale(1)}}
@keyframes lead{0%,30%,100%{transform:translateY(0)}36%{transform:translateY(-18px)}42%{transform:translateY(0)}46%{transform:translateY(-8px)}50%{transform:translateY(0)}}
@keyframes rib{0%,20%{transform:scale(0) rotate(-12deg)}30%{transform:scale(1.25) rotate(4deg)}38%{transform:scale(.95) rotate(-2deg)}46%,100%{transform:scale(1) rotate(0)}}
@keyframes li{0%,100%{transform:translateX(0) scale(1);background:transparent}6%{transform:translateX(-10px) scale(1.06);background:rgba(253,228,238,.95)}14%{transform:translateX(0) scale(1);background:transparent}}
@keyframes blog{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 1.5s ease-in-out infinite}
.fl{transform-box:fill-box;transform-origin:center;animation:fl 1.5s ease-in-out infinite}
.bubble{animation:bubble 3s ease-out infinite,bobb 1.5s ease-in-out infinite}
.num{animation:pop 3s ease-out infinite;transform-origin:50% 60%}
.lead{animation:lead 3s ease-out infinite}
.blog{animation:blog 3s ease-in-out infinite}
.sum li{border-radius:16px;animation:li 3s ease-out infinite}
.sum li:nth-child(1){animation-delay:.6s}.sum li:nth-child(2){animation-delay:.9s}.sum li:nth-child(3){animation-delay:1.2s}.sum li:nth-child(4){animation-delay:1.5s}
.ribbon .t{animation:rib 3s ease-out infinite;transform-origin:50% 50%}

/* キャラの演技（4 秒で一周）: 腕組みで「ふん」→ ほっぺを膨らませる → 両手でガッツポーズ → 手を振る */
.chr{position:absolute;left:-74px;bottom:-24px;width:650px;height:650px;
 -webkit-mask-image:linear-gradient(to bottom,#000 82%,transparent 99%)}
.chr img{position:absolute;inset:0;width:100%;height:100%;opacity:0;transform-origin:50% 100%}
@keyframes sCross{0%{opacity:1}19%{opacity:1}21%{opacity:0}98%{opacity:0}100%{opacity:1}}
@keyframes sPout{0%,19%{opacity:0}21%{opacity:1}36%{opacity:1}38%{opacity:0}100%{opacity:0}}
@keyframes sCheer{0%,36%{opacity:0}38%{opacity:1}61%{opacity:1}63%{opacity:0}100%{opacity:0}}
@keyframes sWave{0%,61%{opacity:0}63%{opacity:1}98%{opacity:1}100%{opacity:0}}
@keyframes mCross{0%,100%{transform:translate(0,26px)}8%{transform:translate(0,26px) rotate(-2deg)}16%{transform:translate(0,26px) rotate(1deg)}}
@keyframes mPout{20%{transform:scale(1.04)}24%{transform:scale(1)}28%{transform:translateX(-6px)}32%{transform:translateX(6px)}36%{transform:translateX(0)}}
@keyframes mCheer{37%{transform:translateY(0) scale(1.04)}43%{transform:translateY(-34px)}49%{transform:translateY(0)}55%{transform:translateY(-34px)}61%{transform:translateY(0)}}
@keyframes mWave{0%,62%{transform:translate(20px,0) scale(.86)}65%{transform:translate(20px,-6px) scale(.88)}68%,100%{transform:translate(20px,0) scale(.86)}}
/* 手を振る: 手首を軸に手だけを回した 9 コマ（wave-sprite.png）を 0.75 秒で 1 往復 */
@keyframes hand{from{background-position:0 0}to{background-position:-5850px 0}}
.chr .c1{animation:sCross 4s linear infinite,mCross 4s ease-in-out infinite}
.chr .c2{animation:sPout 4s linear infinite,mPout 4s ease-in-out infinite}
.chr .c3{animation:sCheer 4s linear infinite,mCheer 4s ease-in-out infinite}
.chr .c4{position:absolute;inset:0;opacity:0;transform-origin:50% 100%;background:url(wave-sprite.png) 0 0/5850px 650px no-repeat;
 animation:sWave 4s linear infinite,mWave 4s ease-in-out infinite,hand .75s steps(9) .25s infinite}

/* キャラと吹き出しの間: 頭から湧いて昇るハート（1.5 秒で一周・時間差）と、その場で弾むハート */
@keyframes rise{0%{transform:translate(0,40px) scale(.2);opacity:0}15%{opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),-95px) scale(1.2);opacity:0}}
.rise{position:absolute;width:44px;height:40px;animation:rise 1.5s ease-out infinite}
.rise svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 6px rgba(214,62,118,.25))}
</style></head><body>
<svg class="deco" width="1080" height="1080" style="left:0;top:0" id="bg"></svg>
<div class="blog"><div class="k">節約・ポイ活のブログ</div><div class="n"><img src="mascot-avatar.png">Daily Hack</div><div class="t">お得を毎日、<em>ハック。</em></div></div>

 <img class="c1" src="expr-09-arms-crossed.png">

n-delay:-0.15s;width:44px;height:40px"><svg viewBox="0 0 24 22"><path d="M0 6 C0 -2 10 -4 12 3 C14 -4 24 -2 24 6 C24 14 12 20 12 22 C12 20 0 14 0 6 Z" fill="#EC5C90"/></svg></div>
<div class="bubble">

  <path d="M40 6 H430 Q464 6 464 40 V176 Q464 210 430 210 H300 Q286 232 262 262 Q262 232 248 210 H40 Q6 210 6 176 V40 Q6 6 40 6 Z" fill="#fff"/>
 </svg>
 <div class="tx">
  <div class="a">見栄じゃないわよ。</div>
  <div class="b">あんたの損を、もっと遠くまで。</div>

 </div>

 <linearGradient id="g" x1="0" y1="-1" x2="0" y2="1"><stop offset="0" stop-color="#5BB8FF"/><stop offset=".55" stop-color="#1D9BF0"/><stop offset="1" stop-color="#0C6FC0"/></linearGradient>

 <g clip-path="url(#clip)"><rect class="shine" x="-12" y="-80" width="18" height="160" fill="#fff" opacity=".55"/></g>

</svg></div>

 <div class="h"><i></i>アタシが毎日 指摘してること<i></i></div>
 <ul>
  <li><span>💰</span><p>ポイ活・<em>節約</em></p></li>
  <li><span>💳</span><p><em>クレカ</em>比較</p></li>
  <li><span>🍚</span><p>コスパ最強<em>グルメ</em></p></li>
  <li><span>🎡</span><p>お得な<em>お出かけ</em></p></li>
 </ul>

<script>
const s=document.getElementById('bg');let k=11;const r=()=>{k=(k*9301+49297)%233280;return k/233280};
const ns='http://www.w3.org/2000/svg';
const add=(t,a)=>{const e=document.createElementNS(ns,t);for(const x in a)e.setAttribute(x,a[x]);s.appendChild(e);return e};
// やわらかい玉ボケ（文字の帯は避ける）
for(let i=0;i<22;i++){const x=r()*1080,y=r()*1080,R=8+r()*22;if(x>520)continue;if(y<330)continue;if(x>40&&y>440)continue;
 add('circle',{cx:x,cy:y,r:R,fill:['#FFFFFF','#F8C9D9','#FFF1C8'][i%3],opacity:.55+r()*.3});}
// ハート
let hi=0;const heart=(x,y,z,c,o)=>{const g=add('g',{transform:`translate(${x},${y}) scale(${z}) rotate(${-15+r()*30} 12 10)`});const e=document.createElementNS(ns,'path');e.setAttribute('d','M0 6 C0 -2 10 -4 12 3 C14 -4 24 -2 24 6 C24 14 12 20 12 22 C12 20 0 14 0 6 Z');e.setAttribute('fill',c);e.setAttribute('opacity',o);e.setAttribute('class','fl');e.style.animationDelay=(-(hi++)*0.5)+'s';g.appendChild(e);};
[[1012,150,2.2],[1036,566,1.8],[500,520,2.4],[60,120,2.2],[480,60,1.6],[260,60,1.8]].forEach(([x,y,z],i)=>heart(x,y,z,i%2?'#F09DBB':'#EC5C90',.75));
// きらきら
let si=0;const star=(x,y,z,c)=>{const g=add('g',{transform:`translate(${x},${y}) scale(${z})`});const e=document.createElementNS(ns,'path');e.setAttribute('d','M0 -12 Q2 -2 12 0 Q2 2 0 12 Q-2 2 -12 0 Q-2 -2 0 -12 Z');e.setAttribute('fill',c);e.setAttribute('class','tw');e.style.animationDelay=(-(si++)*0.5)+'s';g.appendChild(e);};
[[1040,90,1.4],[570,150,1.2],[1040,300,1.1],[560,500,1.3],[1030,520,1.1],[250,150,1.4],[440,170,1.2],[510,20,1]].forEach(([x,y,z],i)=>star(x,y,z,i%2?'#F5C518':'#1D9BF0'));
(()=>{const N=8,R1=50,R2=42,pts=[];for(let i=0;i<N*2;i++){const a=Math.PI*i/N-Math.PI/2,rr=i%2?R2:R1;pts.push([Math.cos(a)*rr,Math.sin(a)*rr]);}
 let d='';for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length],m=[(p[0]+q[0])/2,(p[1]+q[1])/2];d+=(i?' Q':'M'+((pts[pts.length-1][0]+p[0])/2)+' '+((pts[pts.length-1][1]+p[1])/2)+' Q')+p[0].toFixed(2)+' '+p[1].toFixed(2)+' '+m[0].toFixed(2)+' '+m[1].toFixed(2);}
 d+='Z';document.getElementById('starFill').setAttribute('d',d);document.getElementById('star').setAttribute('d',d);})();
</script>
