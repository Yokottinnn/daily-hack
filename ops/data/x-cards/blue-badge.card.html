<!-- 青バッジ（Premium の認証）取得の報告画像（2026-10-12）。follower-300 の 3 版目と同じ骨格（キャラを片側に大きく・反対側に主役・下に普段の発信内容）。
     作り直すとき: この HTML と expr-05-smug.png、@fontsource/zen-maru-gothic を zm/ として同じ階層に置き、
     静止画: playwright で 1080x1080 を jpeg 92 で撮る → public/images/blue-badge/x/1-card.jpg
     動く版: node scripts/gen-x-gif.mjs <この HTML> public/images/blue-badge/x/1-card.gif 1080 12 3
     素材はキャラと自作の図だけなので出所の行は要らない。バッジは X の画面部品の写しではなく、自分で描いた青い星形＋チェック -->
<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="zm/500.css"><link rel="stylesheet" href="zm/700.css"><link rel="stylesheet" href="zm/900.css">
<style>
:root{--p100:#FDE4EE;--p200:#F8C9D9;--p300:#F09DBB;--p500:#EC5C90;--p600:#D63E76;--p700:#A82959;--c100:#FFF1C8;--y:#F5C518;--ink:#2A1923;--ink2:#5A4651;--b400:#3BA4F5;--b500:#1D9BF0;--b700:#0C6FC0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px}
body{font-family:"Zen Maru Gothic",sans-serif;color:var(--ink);overflow:hidden;position:relative;
 background:
  radial-gradient(460px 400px at 78% 34%,rgba(214,236,255,.95),transparent 70%),
  radial-gradient(520px 380px at 30% 20%,rgba(255,241,200,.8),transparent 70%),
  radial-gradient(420px 420px at 90% 95%,rgba(248,201,217,.7),transparent 70%),
  linear-gradient(170deg,#FFF8FA 0%,#FDE4EE 100%)}
.deco{position:absolute;pointer-events:none;left:0;top:0}
.top{position:absolute;top:52px;left:545px;right:30px;display:flex;justify-content:center;align-items:center;gap:14px;color:var(--p600);font-weight:900;font-size:22px;letter-spacing:.3em}
.top i{display:block;width:44px;height:2px;background:var(--p300);border-radius:2px}
.col{position:absolute;left:545px;right:30px;text-align:center}
.lead{top:92px;font-weight:900;font-size:70px;color:var(--b700);letter-spacing:.06em;-webkit-text-stroke:12px #fff;paint-order:stroke fill;filter:drop-shadow(0 6px 10px rgba(12,111,192,.18))}
.badge{position:absolute;left:calc(545px + (505px - 300px)/2);top:182px;width:300px;height:300px;filter:drop-shadow(0 18px 26px rgba(12,111,192,.35))}
.badge svg{width:100%;height:100%;overflow:visible}
.shine{position:absolute;inset:0;border-radius:50%;overflow:hidden;-webkit-mask:url(#m);pointer-events:none}
.ribbon{position:absolute;top:478px;left:calc(545px + (505px - 380px)/2);width:380px;height:86px}
.ribbon .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:52px;letter-spacing:.14em;top:-9px}
.mascot{position:absolute;left:-60px;bottom:-24px;width:640px;-webkit-mask-image:linear-gradient(to bottom,#000 82%,transparent 99%)}
.bubble{position:absolute;left:30px;top:56px;width:480px;height:250px}
.bubble .tx{position:absolute;left:16px;right:16px;top:28px;text-align:center}
.bubble .a{white-space:nowrap;font-weight:900;font-size:44px;color:var(--b700);letter-spacing:.04em;line-height:1.2}
.bubble .b{white-space:nowrap;font-weight:700;font-size:27px;color:var(--ink);line-height:1.4;margin-top:10px}
.bubble .c{white-space:nowrap;font-weight:500;font-size:22px;color:var(--ink2);margin-top:6px}
.sum{top:600px;bottom:44px;background:rgba(255,255,255,.75);border-radius:34px;box-shadow:0 18px 36px -20px rgba(214,62,118,.35);padding:28px 34px 18px;text-align:left}
.sum .h{display:flex;align-items:center;gap:12px;justify-content:center;color:var(--p600);font-weight:900;font-size:27px;letter-spacing:.04em;margin-bottom:12px}
.sum .h i{flex:1;height:2px;background:var(--p200);border-radius:2px}
.sum ul{list-style:none}
.sum li{display:flex;align-items:center;gap:16px;font-weight:700;font-size:32px;color:var(--ink);height:86px;border-bottom:2px dotted var(--p200)}
.sum li:last-child{border-bottom:none}
.sum li span{display:flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:50%;background:var(--p100);font-size:29px;flex:none}
.sum li em{font-style:normal;color:var(--p600)}
/* 動く版（GIF）用。3 秒で一周。静止画は t=0 で撮るので、0% が完成形になるように書く */
@keyframes pop{0%,100%{transform:scale(1) rotate(0)}8%{transform:scale(1.08) rotate(-4deg)}16%{transform:scale(.97) rotate(2deg)}24%{transform:scale(1) rotate(0)}}
@keyframes sweep{0%,40%{transform:translateX(-160%) rotate(20deg)}70%,100%{transform:translateX(160%) rotate(20deg)}}
@keyframes tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.55)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.badge{animation:pop 3s ease-in-out infinite;transform-origin:50% 50%}
.sweep{position:absolute;top:-20%;left:30%;width:28%;height:140%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:sweep 3s ease-in-out infinite}
.tw{animation:tw 1.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tw.d{animation-delay:-.75s}
.bubble{animation:bob 3s ease-in-out infinite}
</style></head><body>
<svg class="deco" width="1080" height="1080" id="bg"></svg>
<div class="top"><i></i>DAILY HACK<i></i></div>
<img class="mascot" src="expr-05-smug.png">
<div class="bubble">
 <svg width="480" height="250" viewBox="0 0 480 250" style="overflow:visible;filter:drop-shadow(0 14px 22px rgba(12,111,192,.18))">
  <path d="M40 6 H440 Q474 6 474 40 V176 Q474 210 440 210 H300 Q286 232 262 262 Q262 232 248 210 H40 Q6 210 6 176 V40 Q6 6 40 6 Z" fill="#fff"/>
 </svg>
 <div class="tx">
  <div class="a">見栄じゃないわよ。</div>
  <div class="b">あんたの損を、もっと遠くまで。</div>
  <div class="c">届けるためなんだから</div>
 </div>
</div>
<div class="col lead">青バッジ</div>
<div class="badge">
 <svg viewBox="-60 -60 120 120">
  <defs>
   <linearGradient id="g" x1="0" y1="-1" x2="0" y2="1"><stop offset="0" stop-color="#5BB8FF"/><stop offset=".55" stop-color="#1D9BF0"/><stop offset="1" stop-color="#0C6FC0"/></linearGradient>
   <clipPath id="clip"><path id="star"/></clipPath>
  </defs>
  <path id="starFill" fill="url(#g)" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
  <g clip-path="url(#clip)"><foreignObject x="-60" y="-60" width="120" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:120px;height:120px;overflow:hidden"><div class="sweep"></div></div></foreignObject></g>
  <path d="M-21 1 L-6 16 L23 -15" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
 </svg>
</div>
<div class="ribbon">
 <svg width="380" height="86" viewBox="0 0 380 86">
  <path d="M0 22 L40 22 L40 80 L0 80 L19 51 Z" fill="#0C6FC0"/>
  <path d="M380 22 L340 22 L340 80 L380 80 L361 51 Z" fill="#0C6FC0"/>
  <path d="M40 80 L58 70 L58 80 Z M340 80 L322 70 L322 80 Z" fill="#08508C"/>
  <rect x="30" y="6" width="320" height="64" rx="14" fill="#1D9BF0"/>
  <rect x="30" y="6" width="320" height="28" rx="14" fill="#fff" opacity=".16"/>
 </svg>
 <div class="t">付けた！</div>
</div>
<div class="col sum">
 <div class="h"><i></i>ここから もっと濃くすること<i></i></div>
 <ul>
  <li><span>💰</span><p>ポイ活・<em>節約</em>の最新</p></li>
  <li><span>💳</span><p><em>クレカ</em>・改悪の速報</p></li>
  <li><span>🎡</span><p>お得な<em>お出かけ</em>情報</p></li>
 </ul>
</div>
<script>
// バッジの外形: 角の丸い 8 つ山の星（自作）
(()=>{const N=8,R1=50,R2=42,pts=[];for(let i=0;i<N*2;i++){const a=Math.PI*i/N-Math.PI/2,r=i%2?R2:R1;pts.push([Math.cos(a)*r,Math.sin(a)*r]);}
 let d='';for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length],m=[(p[0]+q[0])/2,(p[1]+q[1])/2];d+=(i?' Q':'M'+((pts[pts.length-1][0]+p[0])/2)+' '+((pts[pts.length-1][1]+p[1])/2)+' Q')+p[0].toFixed(2)+' '+p[1].toFixed(2)+' '+m[0].toFixed(2)+' '+m[1].toFixed(2);}
 d+='Z';document.getElementById('starFill').setAttribute('d',d);document.getElementById('star').setAttribute('d',d);})();
const s=document.getElementById('bg');let k=11;const r=()=>{k=(k*9301+49297)%233280;return k/233280};
const ns='http://www.w3.org/2000/svg';
const add=(t,a)=>{const e=document.createElementNS(ns,t);for(const x in a)e.setAttribute(x,a[x]);s.appendChild(e);return e};
for(let i=0;i<22;i++){const x=r()*1080,y=r()*1080,R=8+r()*22;if(x>520)continue;if(y<330)continue;if(x>40&&y>440)continue;
 add('circle',{cx:x,cy:y,r:R,fill:['#FFFFFF','#CFE8FF','#FFF1C8'][i%3],opacity:.55+r()*.3});}
const star=(x,y,z,c,i)=>{const g=add('path',{d:'M0 -12 Q2 -2 12 0 Q2 2 0 12 Q-2 2 -12 0 Q-2 -2 0 -12 Z',fill:c,transform:`translate(${x},${y}) scale(${z})`});
 const w=document.createElementNS(ns,'g');w.setAttribute('class','tw'+(i%2?' d':''));s.appendChild(w);w.appendChild(g);};
[[1030,110,1.6],[580,180,1.4],[1030,330,1.3],[590,440,1.5],[1035,560,1.1],[455,460,1.3],[100,420,1],[520,30,1]].forEach(([x,y,z],i)=>star(x,y,z,i%2?'#F5C518':'#1D9BF0',i));
</script>
</body></html>
