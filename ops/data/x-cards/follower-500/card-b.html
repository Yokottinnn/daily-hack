<!-- フォロワー 500 人のお礼画像 B 版（2026-10-18・利用者の「別の構図も」）。A 版（card.html）と見比べる用。
     構図: 明るいクリームの地 × 中央に金のメダル（500人）× 左下に腕組みのキャラ（expr-09-arms-crossed）× 右下に「これからも」の宣言。
     作り直すとき: この階層で playwright で 1080x1080 を jpeg 92 で撮る → public/images/follower-500/x/1-card-b.jpg。素材はキャラと自作の図だけ。 -->
<!doctype html><html lang="ja"><head><meta charset="utf-8">
<style>
@font-face{font-family:Z;src:url(ZenMaru-500.woff2);font-weight:500}
@font-face{font-family:Z;src:url(ZenMaru-700.woff2);font-weight:700}
@font-face{font-family:Z;src:url(ZenMaru-900.woff2);font-weight:900}
@font-face{font-family:Z;src:url(ZenMaru-latin-900.woff2);font-weight:900;unicode-range:U+0000-00FF}
:root{--p500:#EC5C90;--p600:#D63E76;--p200:#F8C9D9;--y:#F5C518;--ink:#2A1923;--ink2:#5A4651}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px}
body{font-family:Z,sans-serif;color:var(--ink);overflow:hidden;position:relative;
 background:repeating-conic-gradient(from 0deg at 540px 400px,rgba(245,197,24,.10) 0 8deg,rgba(255,255,255,0) 8deg 16deg),
  radial-gradient(600px 520px at 540px 400px,#FFF6D6 0%,#FFF1C8 55%,#FCE5A4 100%)}
.deco{position:absolute;left:0;top:0;pointer-events:none}
.top{position:absolute;top:50px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:14px;color:var(--p600);font-weight:900;font-size:22px;letter-spacing:.32em}
.top i{display:block;width:44px;height:2px;background:var(--p600);opacity:.6}
.medal{position:absolute;left:290px;top:100px;width:500px;height:500px;border-radius:50%;
 background:radial-gradient(circle at 38% 30%,#FFF3B0 0%,#F5C518 42%,#D99A00 100%);
 box-shadow:0 26px 44px -18px rgba(168,110,0,.55),inset 0 0 0 16px rgba(255,255,255,.55),inset 0 0 0 30px rgba(217,154,0,.35)}
.medal .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.medal .l{font-weight:900;font-size:46px;color:#7A4A00;letter-spacing:.08em}
.medal .n{font-weight:900;font-size:190px;line-height:1;color:#fff;-webkit-text-stroke:10px #B07800;paint-order:stroke fill;letter-spacing:-.02em}
.medal .n em{font-style:normal;font-size:76px}
.ribbon{position:absolute;left:340px;top:560px;width:400px;height:96px}
.ribbon .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:54px;letter-spacing:.16em;top:-10px}
.mascot{position:absolute;left:-40px;bottom:-20px;width:470px;-webkit-mask-image:linear-gradient(to bottom,#000 84%,transparent 99%)}
.bubble{position:absolute;left:40px;top:430px;width:300px}
.bubble .in{background:#fff;border-radius:26px;padding:18px 20px;text-align:center;box-shadow:0 14px 26px -14px rgba(168,41,89,.45);border:3px solid var(--p200)}
.bubble .a{font-weight:900;font-size:36px;color:var(--p600);line-height:1.3}
.bubble .b{font-weight:700;font-size:22px;color:var(--ink2);margin-top:4px}
.bubble:after{content:"";position:absolute;left:120px;bottom:-24px;border:16px solid transparent;border-top:28px solid #fff;border-bottom:0}
.vow{position:absolute;right:50px;bottom:60px;width:560px;background:#fff;border-radius:30px;padding:26px 32px 28px;box-shadow:0 20px 36px -18px rgba(168,41,89,.35);border-top:12px solid var(--p500)}
.vow .h{font-weight:900;font-size:26px;color:var(--p600);letter-spacing:.06em}
.vow .l{font-weight:900;font-size:36px;line-height:1.4;margin-top:8px;white-space:nowrap}
.vow .l em{font-style:normal;color:var(--p600)}
</style></head><body>
<svg class="deco" width="1080" height="1080" id="bg"></svg>
<div class="top"><i></i>DAILY HACK<i></i></div>
<div class="medal"><div class="in"><div class="l">フォロワー</div><div class="n">500<em>人</em></div></div></div>
<div class="ribbon">
 <svg width="400" height="96" viewBox="0 0 400 96">
  <path d="M0 24 L44 24 L44 88 L0 88 L21 56 Z" fill="#D63E76"/><path d="M400 24 L356 24 L356 88 L400 88 L379 56 Z" fill="#D63E76"/>
  <path d="M44 88 L62 76 L62 88 Z M356 88 L338 76 L338 88 Z" fill="#A82959"/>
  <rect x="32" y="6" width="336" height="70" rx="14" fill="#EC5C90"/><rect x="32" y="6" width="336" height="30" rx="14" fill="#fff" opacity=".14"/>
 </svg><div class="t">突破！</div></div>
<img class="mascot" src="expr-09-arms-crossed.png">
<div class="bubble"><div class="in"><div class="a">ま、当然よね</div><div class="b">次は1,000人</div></div></div>
<div class="vow"><div class="h">これからも</div><div class="l"><em>圧倒的なお得情報</em>と、<br>あんたの<em>損</em>を暴いていくわよ</div></div>
<script>
const s=document.getElementById('bg');let k=5;const r=()=>{k=(k*9301+49297)%233280;return k/233280};
const ns='http://www.w3.org/2000/svg';const add=(t,a)=>{const e=document.createElementNS(ns,t);for(const x in a)e.setAttribute(x,a[x]);s.appendChild(e);return e};
const cols=['#EC5C90','#F5C518','#F09DBB','#FFFFFF','#D63E76'];
for(let i=0;i<60;i++){const x=r()*1080,y=r()*1080;if(x>260&&x<820&&y>80&&y<680)continue;if(y>700)continue;
 add('rect',{x,y,width:6+r()*10,height:12+r()*16,rx:2,fill:cols[i%5],opacity:.6+r()*.35,transform:`rotate(${r()*360} ${x} ${y})`});}
</script>
</body></html>
