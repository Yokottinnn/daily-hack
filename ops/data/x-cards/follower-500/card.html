<!-- フォロワー 500 人のお礼画像（2026-10-18）の元。300 人（follower-300.card.html）と構図を変えた：
     濃いプラムの地 × 金とピンク、キャラは右・得意げ（expr-05-smug）、数字は左に大きく、下は「これからも」の宣言。
     作り直すとき: この階層で playwright で 1080x1080 を jpeg 92 で撮る → public/images/follower-500/x/1-card.jpg。素材はキャラと自作の図だけなので出所の行は要らない。 -->
<!doctype html><html lang="ja"><head><meta charset="utf-8">
<style>
@font-face{font-family:Z;src:url(ZenMaru-500.woff2);font-weight:500}
@font-face{font-family:Z;src:url(ZenMaru-700.woff2);font-weight:700}
@font-face{font-family:Z;src:url(ZenMaru-900.woff2);font-weight:900}
@font-face{font-family:Z;src:url(ZenMaru-latin-900.woff2);font-weight:900;unicode-range:U+0000-00FF}
:root{--p300:#F09DBB;--p500:#EC5C90;--p600:#D63E76;--c100:#FFF1C8;--y:#F5C518;--ink:#2A1923;--ink2:#46293A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px}
body{font-family:Z,sans-serif;color:#fff;overflow:hidden;position:relative;
 background:radial-gradient(560px 460px at 30% 34%,rgba(214,62,118,.42),transparent 70%),
  radial-gradient(520px 520px at 88% 88%,rgba(245,197,24,.18),transparent 70%),
  linear-gradient(160deg,#3A2030 0%,#2A1923 55%,#1E1219 100%)}
.deco{position:absolute;left:0;top:0;pointer-events:none}
.top{position:absolute;top:54px;left:60px;display:flex;align-items:center;gap:14px;color:var(--y);font-weight:900;font-size:22px;letter-spacing:.32em}
.top i{display:block;width:44px;height:2px;background:var(--y);opacity:.7}
.lead{position:absolute;top:104px;left:56px;font-weight:900;font-size:70px;color:#fff;letter-spacing:.04em}
.num{position:absolute;top:168px;left:40px;height:300px;line-height:300px;white-space:nowrap}
.num span{position:absolute;left:0;top:0}
.num .bk{color:transparent;-webkit-text-stroke:22px rgba(255,255,255,.95);filter:drop-shadow(0 14px 22px rgba(0,0,0,.35))}
.num .fr{background:linear-gradient(180deg,#FFE58A 0%,#F5C518 52%,#E0A800 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.num b{font-size:300px;font-weight:900;letter-spacing:-.02em}
.num em{font-style:normal;font-size:110px;font-weight:900;margin-left:6px}
.badge{position:absolute;top:478px;left:70px;background:var(--p500);color:#fff;font-weight:900;font-size:56px;letter-spacing:.16em;padding:10px 40px 14px 50px;border-radius:999px;box-shadow:0 14px 26px -12px rgba(236,92,144,.8);transform:rotate(-4deg)}
.mascot{position:absolute;right:-60px;bottom:-10px;width:600px;-webkit-mask-image:linear-gradient(to bottom,#000 84%,transparent 99%)}
.bubble{position:absolute;right:40px;top:96px;width:380px}
.bubble .in{background:#fff;color:var(--ink);border-radius:30px;padding:24px 26px;text-align:center;box-shadow:0 16px 30px -14px rgba(0,0,0,.5)}
.bubble .a{font-weight:900;font-size:44px;color:var(--p600);line-height:1.3}
.bubble .b{font-weight:700;font-size:25px;color:var(--ink2);margin-top:6px}
.bubble:after{content:"";position:absolute;left:150px;bottom:-26px;border:18px solid transparent;border-top:30px solid #fff;border-bottom:0}
.vow{position:absolute;left:56px;bottom:56px;width:580px;background:rgba(255,255,255,.95);color:var(--ink);border-radius:30px;padding:26px 32px 28px;box-shadow:0 20px 36px -18px rgba(0,0,0,.55);border-left:12px solid var(--y)}
.vow .h{font-weight:900;font-size:26px;color:var(--p600);letter-spacing:.06em}
.vow .l{font-weight:900;font-size:36px;white-space:nowrap;line-height:1.38;margin-top:8px}
.vow .l em{font-style:normal;color:var(--p600)}
</style></head><body>
<svg class="deco" width="1080" height="1080" id="bg"></svg>
<div class="top"><i></i>DAILY HACK<i></i></div>
<div class="lead">フォロワー</div>
<div class="num"><span class="bk"><b>500</b><em>人</em></span><span class="fr"><b>500</b><em>人</em></span></div>
<div class="badge">突破！</div>
<img class="mascot" src="expr-05-smug.png">
<div class="bubble"><div class="in"><div class="a">まだまだ<br>これからよ</div><div class="b">次は1,000人ね</div></div></div>
<div class="vow"><div class="h">これからも</div><div class="l"><em>圧倒的なお得情報</em>と、<br>あんたの<em>損</em>を暴いていくわよ</div></div>
<script>
const s=document.getElementById('bg');let k=7;const r=()=>{k=(k*9301+49297)%233280;return k/233280};
const ns='http://www.w3.org/2000/svg';const add=(t,a)=>{const e=document.createElementNS(ns,t);for(const x in a)e.setAttribute(x,a[x]);s.appendChild(e);return e};
// 紙吹雪（文字の上を避ける）
const cols=['#F5C518','#EC5C90','#F09DBB','#FFF1C8','#FFFFFF'];
for(let i=0;i<70;i++){const x=r()*1080,y=r()*1080;if(x<640&&y>90&&y<560)continue;if(x<640&&y>720)continue;
 add('rect',{x,y,width:6+r()*10,height:12+r()*16,rx:2,fill:cols[i%5],opacity:.55+r()*.4,transform:`rotate(${r()*360} ${x} ${y})`});}
const star=(x,y,z,c)=>add('path',{d:'M0 -12 Q2 -2 12 0 Q2 2 0 12 Q-2 2 -12 0 Q-2 -2 0 -12 Z',fill:c,transform:`translate(${x},${y}) scale(${z})`});
[[600,120,1.6],[640,470,1.3],[40,600,1.2],[1030,620,1.3],[560,60,1],[470,700,1.4]].forEach(([x,y,z],i)=>star(x,y,z,i%2?'#F5C518':'#FFFFFF'));
</script>
</body></html>
